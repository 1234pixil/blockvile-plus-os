<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tube</title>
<style>
  :root{
    --bg:#0f0f0f;
    --bg-elev:#181818;
    --bg-elev-2:#212121;
    --text:#f1f1f1;
    --text-dim:#aaaaaa;
    --text-dim-2:#717171;
    --border:#303030;
    --accent:#ff0033;
    --accent-hover:#e6002d;
    --chip-bg:#272727;
    --chip-bg-active:#f1f1f1;
    --chip-text-active:#0f0f0f;
    --radius:12px;
    --sidebar-w:240px;
    --header-h:56px;
    font-family: "Roboto", "Segoe UI", Arial, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);height:100%;}
  body{overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;height:var(--header-h);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;background:var(--bg);z-index:100;gap:16px;
    border-bottom:1px solid transparent;
  }
  .hdr-left{display:flex;align-items:center;gap:16px;min-width:170px;}
  .menu-btn{background:none;border:none;color:var(--text);padding:8px;border-radius:50%;display:flex;}
  .menu-btn:hover{background:var(--bg-elev-2);}
  .menu-btn svg{width:22px;height:22px;}
  .logo{display:flex;align-items:center;gap:4px;font-size:20px;font-weight:700;letter-spacing:-0.5px;user-select:none;}
  .logo .play-mark{
    width:30px;height:21px;background:var(--accent);border-radius:6px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .logo .play-mark::after{
    content:"";width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
    border-left:9px solid #fff;margin-left:2px;
  }
  .hdr-center{flex:1;max-width:640px;display:flex;justify-content:center;position:relative;}
  .search-wrap{display:flex;width:100%;max-width:600px;position:relative;}
  .search-wrap input{
    flex:1;background:var(--bg);border:1px solid #303030;border-right:none;
    border-radius:20px 0 0 20px;padding:0 16px;height:40px;color:var(--text);font-size:15px;outline:none;
  }
  .search-wrap input:focus{border-color:#1c62b9;}
  .search-btn{
    width:64px;background:var(--bg-elev-2);border:1px solid #303030;border-left:none;
    border-radius:0 20px 20px 0;display:flex;align-items:center;justify-content:center;
  }
  .search-btn svg{width:20px;height:20px;}
  .suggest-panel{
    position:absolute;top:44px;left:0;right:64px;background:var(--bg-elev-2);border-radius:12px;
    box-shadow:0 4px 16px rgba(0,0,0,.5);overflow:hidden;z-index:60;display:none;
  }
  .suggest-panel.show{display:block;}
  .suggest-item{display:flex;align-items:center;gap:14px;padding:9px 16px;font-size:14px;}
  .suggest-item:hover{background:#3a3a3a;}
  .suggest-item svg{width:16px;height:16px;color:var(--text-dim);flex-shrink:0;}
  .hdr-right{display:flex;align-items:center;gap:8px;min-width:170px;justify-content:flex-end;position:relative;}
  .icon-btn{background:none;border:none;color:var(--text);padding:8px;border-radius:50%;display:flex;position:relative;}
  .icon-btn:hover{background:var(--bg-elev-2);}
  .icon-btn svg{width:22px;height:22px;}
  .notif-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:2px solid var(--bg);}
  .avatar{
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,#7c4dff,#18c29c);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0f0f0f;
    margin-left:4px;cursor:pointer;flex-shrink:0;
  }
  .dropdown{
    position:absolute;top:48px;right:0;width:300px;background:var(--bg-elev-2);border-radius:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.55);z-index:110;display:none;overflow:hidden;
  }
  .dropdown.show{display:block;}
  .dropdown-head{padding:14px 16px;font-weight:600;font-size:15px;border-bottom:1px solid var(--border);}
  .notif-item{display:flex;gap:12px;padding:10px 16px;cursor:pointer;align-items:flex-start;}
  .notif-item:hover{background:#3a3a3a;}
  .notif-item .n-thumb{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0f0f0f;}
  .notif-item .n-text{font-size:13px;line-height:1.4;}
  .notif-item .n-time{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .menu-item{padding:11px 16px;font-size:14px;display:flex;align-items:center;gap:14px;}
  .menu-item:hover{background:#3a3a3a;}
  .menu-item svg{width:18px;height:18px;color:var(--text-dim);}

  /* ---------- Sidebar ---------- */
  .sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);
    overflow-y:auto;padding:12px 0;z-index:90;transition:transform .18s ease, width .18s ease;
    background:var(--bg);
  }
  .sidebar.collapsed{width:72px;}
  .sidebar.collapsed .side-label,.sidebar.collapsed .side-heading{display:none;}
  .sidebar.collapsed .side-link{flex-direction:column;gap:2px;height:64px;justify-content:center;border-radius:12px;font-size:10px;}
  .sidebar.collapsed .side-link svg{width:22px;height:22px;}
  .side-section{padding:4px 12px 12px;border-bottom:1px solid var(--border);margin-bottom:8px;}
  .side-section:last-child{border-bottom:none;}
  .side-heading{padding:8px 12px 8px;font-size:15px;font-weight:600;}
  .side-link{
    display:flex;align-items:center;gap:20px;padding:0 12px;height:40px;border-radius:10px;font-size:14px;
    color:var(--text);white-space:nowrap;overflow:hidden;cursor:pointer;
  }
  .side-link:hover{background:var(--bg-elev-2);}
  .side-link.active{background:var(--bg-elev-2);font-weight:600;}
  .side-link svg{width:22px;height:22px;flex-shrink:0;}

  /* ---------- Layout ---------- */
  .app{padding-top:var(--header-h);}
  main{margin-left:var(--sidebar-w);padding:24px 24px 60px;transition:margin-left .18s ease;min-height:calc(100vh - var(--header-h));}
  .sidebar.collapsed ~ main{margin-left:72px;}

  /* ---------- Chips ---------- */
  .chip-row{
    display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;margin-bottom:8px;
    position:sticky;top:var(--header-h);background:var(--bg);z-index:50;padding-top:4px;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;background:var(--chip-bg);border:none;color:var(--text);
    padding:0 14px;height:32px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;
  }
  .chip:hover{background:#3a3a3a;}
  .chip.active{background:var(--chip-bg-active);color:var(--chip-text-active);}

  /* ---------- Grid ---------- */
  .grid{
    display:grid;gap:28px 16px;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  }
  .card{cursor:pointer;}
  .thumb-wrap{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9;background:#222;}
  .thumb-wrap svg{width:100%;height:100%;display:block;}
  .duration{
    position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);color:#fff;
    font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px;letter-spacing:.3px;
  }
  .card-meta{display:flex;gap:10px;margin-top:10px;}
  .card-meta .avatar{margin-left:0;flex-shrink:0;cursor:pointer;}
  .card-title{font-size:14.5px;font-weight:600;line-height:1.35;margin:0 0 4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-sub{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .card-sub .chan-link{cursor:pointer;}
  .card-sub .chan-link:hover{color:var(--text);}
  .card-sub .verified{display:inline-flex;vertical-align:middle;margin-left:3px;}

  .empty-state{text-align:center;padding:80px 20px;color:var(--text-dim);}
  .empty-state h2{color:var(--text);margin-bottom:8px;font-size:20px;}

  /* ---------- Watch page ---------- */
  .watch-layout{display:flex;gap:24px;align-items:flex-start;max-width:1600px;}
  .watch-main{flex:1;min-width:0;max-width:960px;}
  .player{
    width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#000;
    display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;
  }
  .player svg{width:100%;height:100%;pointer-events:none;}
  .center-icon{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;
    background:rgba(0,0,0,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s;pointer-events:none;
  }
  .player.show-center .center-icon{opacity:1;}
  .center-icon svg{width:30px;height:30px;color:#fff;}
  .player-controls{
    position:absolute;bottom:0;left:0;right:0;padding:10px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.8));display:flex;align-items:center;gap:14px;
    opacity:0;transition:opacity .2s;
  }
  .player:hover .player-controls, .player.controls-pinned .player-controls{opacity:1;}
  .progress-bar{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;position:relative;cursor:pointer;}
  .progress-bar:hover{height:6px;}
  .progress-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent);border-radius:2px;}
  .player-controls button{background:none;border:none;padding:4px;display:flex;}
  .player-controls svg{width:20px;height:20px;color:#fff;flex-shrink:0;}
  .player-time{color:#fff;font-size:12px;flex-shrink:0;white-space:nowrap;}
  .ended-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;
  }
  .player.ended .ended-overlay{display:flex;}
  .ended-overlay .replay-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;}
  .ended-overlay .replay-btn:hover{background:rgba(255,255,255,.25);}

  .watch-title{font-size:19px;font-weight:600;margin:16px 0 12px;line-height:1.4;}
  .watch-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .channel-block{display:flex;align-items:center;gap:12px;}
  .channel-click{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .channel-info .cname{font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;}
  .channel-info .csubs{font-size:12px;color:var(--text-dim);}
  .subscribe-btn{
    background:#f1f1f1;color:#0f0f0f;border:none;height:36px;padding:0 16px;border-radius:18px;
    font-weight:600;font-size:14px;margin-left:8px;
  }
  .subscribe-btn.subbed{background:var(--chip-bg);color:var(--text);}
  .action-group{display:flex;gap:8px;flex-wrap:wrap;}
  .pill-btn{
    display:flex;align-items:center;gap:6px;background:var(--chip-bg);border:none;color:var(--text);
    height:36px;padding:0 16px;border-radius:18px;font-size:13.5px;font-weight:500;
  }
  .pill-btn:hover{background:#3a3a3a;}
  .pill-btn.active{color:var(--accent);}
  .pill-btn svg{width:18px;height:18px;}
  .split-pill{display:flex;border-radius:18px;overflow:hidden;background:var(--chip-bg);}
  .split-pill button{background:none;border:none;color:var(--text);height:36px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:13.5px;}
  .split-pill button:first-child{border-right:1px solid #4a4a4a;}
  .split-pill button:hover{background:#3a3a3a;}
  .split-pill button.liked{color:var(--accent);}
  .split-pill button.disliked{color:#4fa8ff;}
  .split-pill svg{width:17px;height:17px;}

  .desc-box{background:var(--bg-elev-2);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13.5px;line-height:1.6;color:var(--text);}
  .desc-box .views-row{font-weight:600;margin-bottom:6px;color:var(--text);}
  .desc-box .views-row span{margin-right:8px;}

  .comments-head{font-size:16px;font-weight:600;margin:24px 0 16px;}
  .comment-box{display:flex;gap:12px;margin-bottom:24px;}
  .comment-box input{width:100%;background:none;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;padding:6px 0;outline:none;}
  .comment-box input:focus{border-bottom-color:#6a6a6a;}
  .comment-box-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .comment-box-actions button{border:none;background:none;border-radius:18px;padding:8px 16px;font-size:13.5px;font-weight:500;color:var(--text);}
  .comment-box-actions button:hover{background:var(--bg-elev-2);}
  .comment-box-actions .comment-submit{background:#3ea6ff;color:#0f0f0f;font-weight:600;}
  .comment-box-actions .comment-submit:disabled{opacity:.4;}
  .comment{display:flex;gap:12px;margin-bottom:20px;}
  .comment .avatar{flex-shrink:0;cursor:default;}
  .comment-body .cmeta{font-size:13px;font-weight:600;margin-bottom:3px;}
  .comment-body .cmeta span{font-weight:400;color:var(--text-dim);margin-left:6px;}
  .comment-body .ctext{font-size:13.5px;line-height:1.5;}
  .comment-actions{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--text-dim);font-size:12px;}
  .comment-actions svg{width:15px;height:15px;vertical-align:middle;}
  .comment-actions .clike{cursor:pointer;display:flex;align-items:center;gap:4px;}
  .comment-actions .clike.on{color:var(--accent);}
  .comment-actions .clike.on svg{fill:currentColor;}

  .up-next{width:400px;flex-shrink:0;}
  .up-next-title{font-weight:600;margin-bottom:12px;font-size:15px;}
  .up-card{display:flex;gap:10px;margin-bottom:10px;cursor:pointer;border-radius:10px;padding:4px;}
  .up-card:hover{background:var(--bg-elev-2);}
  .up-thumb{width:168px;flex-shrink:0;aspect-ratio:16/9;border-radius:8px;overflow:hidden;position:relative;background:#222;}
  .up-thumb svg{width:100%;height:100%;}
  .up-thumb .duration{font-size:11px;padding:1px 4px;bottom:4px;right:4px;}
  .up-info .up-title{font-size:13.5px;font-weight:500;line-height:1.35;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .up-info .up-sub{font-size:12px;color:var(--text-dim);}

  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:18px;padding:6px 10px;border-radius:8px;background:none;border:none;}
  .back-link:hover{background:var(--bg-elev-2);color:var(--text);}
  .back-link svg{width:16px;height:16px;}

  /* ---------- Artist strip (home) ---------- */
  .artist-strip{display:flex;gap:22px;overflow-x:auto;padding:4px 2px 20px;margin-bottom:4px;}
  .artist-strip::-webkit-scrollbar{display:none;}
  .artist-chip{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;cursor:pointer;width:74px;text-align:center;}
  .artist-chip .avatar{margin-left:0;}
  .artist-chip:hover .avatar{outline:2px solid var(--text);outline-offset:2px;}
  .artist-chip span{font-size:12px;color:var(--text-dim);line-height:1.3;}
  .artist-chip:hover span{color:var(--text);}
  .artist-strip-head{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .artist-strip-head .artist-tag{font-size:10px;background:var(--chip-bg);color:var(--text-dim);padding:2px 7px;border-radius:6px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;}

  /* ---------- Channel / Artist page ---------- */
  .channel-banner{width:100%;aspect-ratio:6.2/1;border-radius:16px;overflow:hidden;position:relative;min-height:80px;}
  .channel-banner svg{width:100%;height:100%;display:block;}
  .channel-head{display:flex;align-items:center;gap:24px;padding:20px 4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:8px;}
  .channel-head .avatar{width:88px;height:88px;font-size:30px;margin-left:0;cursor:default;}
  .channel-id{flex:1;min-width:220px;}
  .channel-id h1{font-size:24px;margin:0 0 6px;display:flex;align-items:center;gap:6px;}
  .channel-id .artist-tag{font-size:11px;background:var(--chip-bg);color:var(--text-dim);padding:2px 8px;border-radius:6px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-left:4px;}
  .channel-id .cstats{font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .channel-id .cdesc{font-size:13px;color:var(--text-dim);max-width:560px;}
  .channel-tabs{display:flex;gap:28px;border-bottom:1px solid var(--border);margin-bottom:24px;}
  .channel-tab{padding:14px 2px;font-size:14px;font-weight:500;color:var(--text-dim);border-bottom:2px solid transparent;cursor:pointer;}
  .channel-tab:hover{color:var(--text);}
  .channel-tab.active{color:var(--text);border-bottom-color:var(--text);}
  .about-block{max-width:700px;background:var(--bg-elev-2);padding:20px;border-radius:12px;font-size:13.5px;line-height:1.7;}
  .about-block h3{margin-top:0;font-size:16px;}
  .about-stats{display:flex;gap:32px;margin-top:16px;flex-wrap:wrap;}
  .about-stats div span{display:block;color:var(--text-dim);font-size:12px;}
  .about-stats div b{font-size:14px;}
  .popular-row{display:flex;gap:16px;align-items:center;padding:10px 4px;border-radius:10px;cursor:pointer;}
  .popular-row:hover{background:var(--bg-elev-2);}
  .popular-row .pidx{width:22px;text-align:center;color:var(--text-dim);font-size:14px;flex-shrink:0;}
  .popular-row .pthumb{width:120px;flex-shrink:0;aspect-ratio:16/9;border-radius:8px;overflow:hidden;position:relative;}
  .popular-row .pthumb svg{width:100%;height:100%;}
  .popular-row .pinfo{flex:1;min-width:0;}
  .popular-row .ptitle{font-size:14px;font-weight:500;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .popular-row .psub{font-size:12px;color:var(--text-dim);}

  @media (max-width:900px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.force-open{transform:translateX(0);width:240px;background:var(--bg);box-shadow:2px 0 12px rgba(0,0,0,.5);}
    main{margin-left:0 !important;padding:16px;}
    .hdr-center{max-width:none;}
    .watch-layout{flex-direction:column;}
    .up-next{width:100%;}
    .logo span.wordmark{display:none;}
    .channel-head{padding:16px 0;}
  }
  @media (max-width:560px){
    .hdr-center{display:none;}
    .hdr-right{min-width:auto;}
  }
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:none;}
  .overlay.show{display:block;}

  #toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#2c2c2c;color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;
    box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:all .25s;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Upload modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.show{display:flex;}
  .upload-modal{background:var(--bg-elev);border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.6);}
  .upload-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600;}
  .modal-x{background:none;border:none;color:var(--text);padding:6px;border-radius:50%;display:flex;}
  .modal-x:hover{background:var(--bg-elev-2);}
  .modal-x svg{width:18px;height:18px;}
  .upload-tabs{display:flex;border-bottom:1px solid var(--border);}
  .upload-tab{flex:1;background:none;border:none;color:var(--text-dim);padding:13px 8px;font-size:13.5px;font-weight:600;border-bottom:2px solid transparent;}
  .upload-tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .upload-body{padding:18px;}
  .drop-zone{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    border:2px dashed #3a3a3a;border-radius:12px;padding:40px 20px;cursor:pointer;color:var(--text-dim);font-size:13.5px;text-align:center;
  }

  try{ mediaRecorder = new MediaRecorder(camStream); }
  catch(err){ showToast("Recording isn't supported in this browser"); return; }
  mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = ()=>{
    const blob = new Blob(recordedChunks, {type:'video/webm'});
    const url = URL.createObjectURL(blob);
    loadPendingVideo(url);
  };
  mediaRecorder.start();
  document.getElementById('recDot').style.display='block';
  document.getElementById('recStartBtn').style.display='none';
  document.getElementById('recStopBtn').style.display='inline-flex';
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  document.getElementById('recDot').style.display='none';
  document.getElementById('recStopBtn').style.display='none';
  stopCameraStream();
}
function stopCameraStream(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
}
function loadPendingVideo(url){
  pendingVideo.url = url;
  const previewWrap = document.getElementById('uploadPreviewWrap');
  const preview = document.getElementById('uploadPreview');
  previewWrap.style.display='block';
  preview.src = url;
  preview.onloadedmetadata = ()=>{
    let d = preview.duration;
    pendingVideo.duration = (isFinite(d) && !isNaN(d)) ? d : 0;
    const seekTime = Math.min(1, (pendingVideo.duration||1)/2);
    try{ preview.currentTime = seekTime; }catch(e){}
  };
  preview.onseeked = ()=>{
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 320; canvas.height = 180;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(preview, 0,0,canvas.width,canvas.height);
      pendingVideo.thumbDataURL = canvas.toDataURL('image/jpeg', 0.75);
    }catch(err){ /* thumbnail capture failed - falls back to generated thumb */ }
    preview.currentTime = 0;
  };
  document.getElementById('uploadFields').style.display='block';
  checkPublishEnabled();
}
function checkPublishEnabled(){
  const title = document.getElementById('upTitle').value.trim();
  document.getElementById('publishBtn').disabled = !(title && pendingVideo.url);
}
function publishUpload(){
  const title = document.getElementById('upTitle').value.trim();
  const cat = document.getElementById('upCategory').value;
  const channel = document.getElementById('upChannel').value.trim() || 'Your channel';
  const desc = document.getElementById('upDesc').value.trim();
  if(!title || !pendingVideo.url) return;
  if(!CHANNEL_COLORS[channel]){
    const palette = [["#7c4dff","#c792ff"],["#18c29c","#8ff0d9"],["#ff7a59","#ffb199"],["#2b8aef","#8fc7ff"],["#e0a72e","#ffe28a"],["#ef476f","#ffb3c6"]];
    CHANNEL_COLORS[channel] = palette[Object.keys(CHANNEL_COLORS).length % palette.length];
    CHANNEL_SUBS[channel] = "You";
    CHANNEL_ABOUT[channel] = {joined:"Just now", loc:"—", desc:"Your channel."};
  }
  const id = Math.max(...VIDEOS.map(v=>v.id)) + 1;
  const newVideo = {
    id, title, channel, cat, views:0, when:"Just now",
    dur: secToTime(pendingVideo.duration||0),
    colors: CHANNEL_COLORS[channel],
    likes:0, dislikes:0, subs: CHANNEL_SUBS[channel],
    fileURL: pendingVideo.url,
    thumbDataURL: pendingVideo.thumbDataURL || null,
    desc: desc || undefined
  };
  VIDEOS.unshift(newVideo);
  subscribedChannels.add(channel);
  closeUploadModal();
  showToast("Video published");
  go('/watch/'+id);
}

function stopPlayerTimer(){
  if(player.timer){ clearInterval(player.timer); player.timer=null; }
}
function initPlayer(v){
  stopPlayerTimer();
  if(v.fileURL || v.ytId){ player = { id:v.id, time:0, duration:0, playing:false, muted:false, timer:null }; return; }
  player = { id:v.id, time:0, duration:durToSec(v.dur), playing:true, muted:false, timer:null };
  player.timer = setInterval(tickPlayer, 1000);
}
function handleRealVideoEnded(vid){
  showToast("Up next");
  setTimeout(()=>{
    if(currentView==="watch" && currentVideoId===vid){
      const next = getUpNextList(vid)[0];
      if(next) go("/watch/"+next.id);
    }
  }, 1200);
}
function tickPlayer(){
  if(currentView!=="watch" || currentVideoId!==player.id){ stopPlayerTimer(); return; }
  if(!player.playing) return;
  player.time++;
  if(player.time>=player.duration){
    player.time = player.duration;
    player.playing = false;
    updatePlayerUI();
    const box = document.getElementById("playerBox");
    if(box) box.classList.add("ended");
    setTimeout(()=>{
      if(currentView==="watch" && currentVideoId===player.id){
        const next = getUpNextList(player.id)[0];
        if(next) go("/watch/"+next.id);
      }
    }, 1400);
    return;
  }
  updatePlayerUI();
}
function updatePlayerUI(){
  const fill = document.getElementById("progressFill");
  const label = document.getElementById("timeLabel");
  const pct = player.duration ? (player.time/player.duration*100) : 0;
  if(fill) fill.style.width = pct+"%";
  if(label) label.textContent = secToTime(player.time)+" / "+secToTime(player.duration);
  const playIcon = document.getElementById("iconPlay");
  const pauseIcon = document.getElementById("iconPause");
  if(playIcon && pauseIcon){
    playIcon.style.display = player.playing ? "none":"block";
    pauseIcon.style.display = player.playing ? "block":"none";
  }
}
function togglePlay(e){
  if(e) e.stopPropagation();
  const box = document.getElementById("playerBox");
  if(box && box.classList.contains("ended")){
    player.time = 0; player.playing = true; box.classList.remove("ended");
  } else {
    player.playing = !player.playing;
  }
  updatePlayerUI();
  flashCenterIcon();
}
function flashCenterIcon(){
  const box = document.getElementById("playerBox");
  if(!box) return;
  box.classList.add("show-center");
  clearTimeout(window._centerTimer);
  window._centerTimer = setTimeout(()=>box.classList.remove("show-center"),450);
}
function seekPlayer(e){
  e.stopPropagation();
  const bar = e.currentTarget;
  const rect = bar.getBoundingClientRect();
  const pct = Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
  player.time = Math.round(pct*player.duration);
  const box = document.getElementById("playerBox");
  if(box) box.classList.remove("ended");
  updatePlayerUI();
}
function toggleMute(e){
  e.stopPropagation();
  player.muted = !player.muted;
  const mOn = document.getElementById("iconMuteOn");
  const mOff = document.getElementById("iconMuteOff");
  if(mOn && mOff){ mOn.style.display = player.muted?"none":"block"; mOff.style.display = player.muted?"block":"none"; }
}
function toggleFullscreen(e){
  e.stopPropagation();
  const box = document.getElementById("playerBox");
  if(!box) return;
  try{
    if(!document.fullscreenElement){
      (box.requestFullscreen||box.webkitRequestFullscreen||function(){throw new Error("no fs");}).call(box);
    } else {
      document.exitFullscreen();
    }
  }catch(err){
    showToast("Fullscreen isn't available in this preview");
  }
}

/* ================= Formatting ================= */
function fmtViews(n){
  if(n>=1000000) return (n/1000000).toFixed(n%1000000<100000?0:1)+"M views";
  if(n>=1000) return Math.round(n/1000)+"K views";
  return n+" views";
}
function fmtCount(n){
  if(n>=1000000) return (n/1000000).toFixed(1)+"M";
  if(n>=1000) return (n/1000).toFixed(1)+"K";
  return ""+n;
}
function verifiedBadge(){

}

/* ================= Comments ================= */
function commentSeed(v){
  const names = ["riverstone","kmarsh","teabreak.exe","noalibi","futurefossil","p.quinn"];
  const texts = [
    "the pacing on this one was so good, didn't check the time once",
    "not me watching this at 2am instead of sleeping",
    "the part around the middle lives in my head now",
    "underrated channel, algorithm better start doing its job",
    "came for the title, stayed for the whole thing",
    "who else is rewatching after the update"
  ];
  const seedNum = v.id;
  return [0,1,2].map(i=>({
    id: v.id*100+i,
    name: names[(seedNum+i)%names.length],
    text: texts[(seedNum*3+i)%texts.length],
    likes: (seedNum*7+i*13)%400,
    when: ["3 days ago","1 week ago","5 hours ago"][i]
  }));
}
function getComments(v){
  if(!commentsStore[v.id]) commentsStore[v.id] = window.API_MODE ? [] : commentSeed(v);
  return commentsStore[v.id];
}
function postComment(vid){
  const input = document.getElementById("commentInput");
  const text = (input.value||"").trim();
  if(!text) return;
  const v = VIDEOS.find(x=>x.id===vid);
  const list = getComments(v);
  list.unshift({id:Date.now(),name:"you",text,likes:0,when:"Just now",isYou:true});
  input.value = "";
  render();
  showToast("Comment posted");
}
function toggleCommentActions(el){
  const actions = document.getElementById("commentActions");
  if(!actions) return;
  actions.style.display = el.value.trim() ? "flex":"none";
}
function toggleCommentLike(cid){
  if(commentLikes.has(cid)) commentLikes.delete(cid); else commentLikes.add(cid);
  render();
}

/* ================= Channel / Artist page ================= */
function renderChannel(name){
  const vids = VIDEOS.filter(v=>v.channel===name);
  if(vids.length===0){ return `<div class="empty-state"><h2>Channel not found</h2></div>`; }
  const colors = CHANNEL_COLORS[name]||["#555","#888"];
  const about = CHANNEL_ABOUT[name]||{joined:"—",loc:"—",desc:""};
  const subbed = subscribedChannels.has(name);
  const artist = isArtistChannel(name);
  const totalViews = vids.reduce((a,v)=>a+v.views,0);
  const sortedByViews = [...vids].sort((a,b)=>b.views-a.views);

  const tabsHtml = `<div class="channel-tabs">
      <div class="channel-tab ${channelTab==='videos'?'active':''}" onclick="setChannelTab('videos')">${artist?'Popular':'Videos'}</div>
      <div class="channel-tab ${channelTab==='about'?'active':''}" onclick="setChannelTab('about')">About</div>
    </div>`;

  let body;
  if(channelTab==='about'){
    body = `<div class="about-block">
      <h3>About</h3>
      <p>${about.desc}</p>
      <div class="about-stats">
        <div><span>Joined</span><b>${about.joined}</b></div>
        <div><span>Location</span><b>${about.loc}</b></div>
        <div><span>${artist?'Monthly listeners':'Subscribers'}</span><b>${CHANNEL_SUBS[name]}</b></div>
        <div><span>Total views</span><b>${fmtCount(totalViews)}</b></div>
        <div><span>Videos</span><b>${vids.length}</b></div>
      </div>
    </div>`;
  } else if(artist){
    body = sortedByViews.map((v,i)=>`
      <div class="popular-row" onclick="go('/watch/${v.id}')">
        <div class="pidx">${i+1}</div>
        <div class="pthumb">${thumbMedia(v,false)}<span class="duration">${v.dur}</span></div>
        <div class="pinfo">
          <p class="ptitle">${v.title}</p>
          <div class="psub">${fmtViews(v.views)} · ${v.when}</div>
        </div>
      </div>`).join("");
  } else {
    body = `<div class="grid">${vids.map(videoCard).join("")}</div>`;
  }

  return `
    <div class="channel-banner">${bannerSVG(colors)}</div>
    <div class="channel-head">
      <div class="avatar" style="background:linear-gradient(135deg,${colors[0]},${colors[1]})">${initials(name)}</div>
      <div class="channel-id">
        <h1>${name}${verifiedBadge()}${artist?'<span class="artist-tag">Artist</span>':''}</h1>
        <div class="cstats">${CHANNEL_SUBS[name]} ${artist?'monthly listeners':'subscribers'} · ${vids.length} videos</div>
        <div class="cdesc">${about.desc}</div>
      </div>
      <button class="subscribe-btn ${subbed?'subbed':''}" onclick="toggleSub('${name.replace(/'/g,"\\'")}')">${subbed?'Subscribed':'Subscribe'}</button>
    </div>
    ${tabsHtml}
    ${body}
  `;
}
function setChannelTab(tab){ channelTab = tab; render(); }

/* ================= Routing ================= */
function parseRoute(){
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean).map(p=>decodeURIComponent(p));
  if(parts.length===0){ currentView='home'; currentCat='All'; setActiveNav('home'); return; }
  const route = parts[0];
  if(route==='watch'){ currentView='watch'; currentVideoId=Number(parts[1]); setActiveNav(null); }
  else if(route==='channel'){ currentView='channel'; currentChannelName=parts[1]; channelTab='videos'; setActiveNav(null); }
  else if(route==='search'){ currentView='search'; document.getElementById('searchInput').value = parts[1]||''; setActiveNav(null); }
  else if(['home','trending','subs','history','liked','watchlater'].includes(route)){ currentView=route; currentCat='All'; setActiveNav(route); }
  else { currentView='home'; setActiveNav('home'); }
}
function go(path){
  const target = '#'+path;
  if(location.hash===target){ parseRoute(); render(); }
  else { location.hash = target; }
  if(window.innerWidth<=900) closeMobileSidebar();
}
window.addEventListener('hashchange', ()=>{ parseRoute(); render(); });

function render(){
  if(currentView==='watch') main.innerHTML = renderWatch(currentVideoId);
  else if(currentView==='channel') main.innerHTML = renderChannel(currentChannelName);
  else if(currentView==='search') main.innerHTML = renderSearch(document.getElementById('searchInput').value);
  else main.innerHTML = renderHome();
  window.scrollTo(0,0);
  renderSubList();
  closeAllDropdowns();
}
function renderSubList(){
  const wrap = document.getElementById("subChannelList");
  wrap.innerHTML = [...subscribedChannels].map(name=>{
    const colors = CHANNEL_COLORS[name]||["#555","#888"];
    return `<a href="#/channel/${encodeURIComponent(name)}" class="side-link">
      <div class="avatar" style="width:24px;height:24px;font-size:10px;background:linear-gradient(135deg,${colors[0]},${colors[1]});margin-left:0;">${initials(name)}</div>
      <span class="side-label">${name}</span>
    </a>`;
  }).join("") || `<div style="padding:8px 12px;color:var(--text-dim-2);font-size:12.5px;" class="side-label">No subscriptions yet</div>`;
}
function setCat(c){ currentCat=c; render(); }
function setActiveNav(view){
  document.querySelectorAll(".nav-link").forEach(el=>{ el.classList.toggle("active", el.dataset.view===view); });
}

/* ================= Actions ================= */
function toggleSub(channel){
  if(subscribedChannels.has(channel)){ subscribedChannels.delete(channel); showToast("Unsubscribed from "+channel); }
  else { subscribedChannels.add(channel); showToast("Subscribed to "+channel); }
  render();
}
function toggleLike(id){
  if(likedVideos.has(id)) likedVideos.delete(id);
  else { likedVideos.add(id); dislikedVideos.delete(id); }
  render();
}
function toggleDislike(id){
  if(dislikedVideos.has(id)) dislikedVideos.delete(id);
  else { dislikedVideos.add(id); likedVideos.delete(id); }
  render();
}
function toggleWatchLater(id){
  if(watchLater.has(id)){ watchLater.delete(id); showToast("Removed from Watch later"); }
  else { watchLater.add(id); showToast("Saved to Watch later"); }
  render();
}

function doSearch(){
  const q = document.getElementById("searchInput").value.trim();
  document.getElementById("suggestPanel").classList.remove("show");
  if(window.API_MODE){
    if(!q){ go('/home'); return; }
    const yt = parseYTLink(q); if(yt){ playLink(yt); return; }
    if(API_STATUS!=='ok'){ showToast(API_STATUS==='signin' ? 'Sign in (Accounts) to search YouTube here — pasting a link still works' : 'YouTube search isn\'t set up yet — pasting a link still works'); return; }
    showToast('Searching…'); parent.postMessage({bv:'tube-search',q},'*'); return;
  }
  if(!q){ go('/home'); return; }
  go('/search/'+encodeURIComponent(q));
}

/* ================= Blockvile bridge (YouTube API mode) =================
   When this page runs inside Blockvile's YouTube app and you have saved a YouTube API key, Blockvile does the
   searching (the key never enters this page) and sends the real results here. Videos play in YouTube's own player. */
window.API_MODE = false;
let API_HOME = [], API_RESULTS = [], API_NEXT = 100000;
const API_ID = Object.create(null);
function esc2(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"’"); }
function clean(s){ return esc2(s).slice(0,400); }
function chanClean(s){ return (String(s||"YouTube channel").replace(/[<>&"'`\\$\r\n]/g,c=>c==="&"?"+":"’").trim()||"YouTube channel").slice(0,80); }   // used inside inline handlers, so no risky characters at all
function apiList(ids){ return ids.map(i=>VIDEOS.find(v=>v.id===i)).filter(Boolean); }
function isoDur(s){
  const m = /^P(?:\d+D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(s||""); if(!m || !(m[1]||m[2]||m[3])) return "LIVE";
  const h=+m[1]||0, mi=+m[2]||0, se=+m[3]||0, p=n=>String(n).padStart(2,"0");
  return h ? h+":"+p(mi)+":"+p(se) : mi+":"+p(se);
}
function agoText(iso){
  const t = Date.parse(iso); if(!t) return ""; const d = (Date.now()-t)/1000;
  const u = [[31536000,"year"],[2592000,"month"],[604800,"week"],[86400,"day"],[3600,"hour"],[60,"minute"]];
  for(const [n,l] of u){ if(d>=n){ const k=Math.floor(d/n); return k+" "+l+(k>1?"s":"")+" ago"; } }
  return "just now";
}
function apiVideo(x){
  if(!x || !/^[\w-]{11}$/.test(x.id||"")) return null;
  const old = API_ID[x.id]; if(old) return old;
  const ch = chanClean(x.channel);
  if(!CHANNEL_COLORS[ch]){
    let h=0; for(const c of ch) h=(h*31+c.charCodeAt(0))%360;
    CHANNEL_COLORS[ch] = ["hsl("+h+",65%,48%)","hsl("+((h+40)%360)+",70%,68%)"];
    CHANNEL_SUBS[ch] = "—"; CHANNEL_ABOUT[ch] = {joined:"—",loc:"—",desc:"A channel from your YouTube results."};
  }
  const views = Math.max(0, +x.views||0), likes = Math.max(0, +x.likes||0);
  const v = {id:API_NEXT++, ytId:x.id, title:clean(x.title||"Untitled"), channel:ch, cat:"All", views, when:agoText(x.published),
    dur:isoDur(x.duration), colors:CHANNEL_COLORS[ch], likes, dislikes:0, subs:"",
    thumbDataURL:"https://i.ytimg.com/vi/"+x.id+"/mqdefault.jpg",
    desc:esc2(x.description||"").replace(/\n/g,"<br>") || "No description.",
    raw:{id:x.id,title:String(x.title||"").slice(0,200),channel:String(x.channel||"").slice(0,100),published:x.published||"",duration:x.duration||"",views,likes}};
  VIDEOS.push(v); API_ID[x.id] = v; return v;
}
function apiIds(list){ return (list||[]).map(apiVideo).filter(Boolean).map(v=>v.id); }
let API_STATUS = "ok";
function parseYTLink(input){
  let t = String(input||"").trim(); if(!t) return null;
  if(/^[\w-]{11}$/.test(t) && !/^[a-z]+$/.test(t)) return t;
  if(!/^https?:\/\//i.test(t)) t = "https://"+t;
  let u; try{ u = new URL(t); }catch(e){ return null; }
  const host = u.hostname.replace(/^(www|m|music)\./,"");
  if(!/^(youtube\.com|youtu\.be|youtube-nocookie\.com)$/.test(host)) return null;
  let id = host==="youtu.be" ? u.pathname.split("/")[1] : u.searchParams.get("v");
  if(!id){ const m = u.pathname.match(/^\/(?:shorts|live|embed|v|e)\/([\w-]{11})/); if(m) id = m[1]; }
  return id && /^[\w-]{11}$/.test(id) ? id : null;
}
async function playLink(ytId){
  let v = API_ID[ytId];
  if(!v){
    let title = "YouTube video", channel = "YouTube";
    try{ const r = await fetch("https://noembed.com/embed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+ytId)); const j = await r.json(); if(j.title) title = j.title; if(j.author_name) channel = j.author_name; }catch(e){}
    v = apiVideo({id:ytId,title,channel,published:"",description:"",duration:"",views:0,likes:0});
  }
  if(v) go("/watch/"+v.id);
}
// remember subscriptions, likes, watch later and history on this device (Blockvile stores them)
function apiPersist(){
  const raw = ids => [...ids].map(i=>VIDEOS.find(v=>v.id===i)).filter(v=>v&&v.raw).map(v=>v.raw);
  const subs = [...subscribedChannels].map(String);
  const dis = [...dislikedVideos].map(i=>VIDEOS.find(v=>v.id===i)).filter(v=>v&&v.ytId).map(v=>v.ytId);
  try{ parent.postMessage({bv:"tube-save", state:{subs, liked:raw(likedVideos), disliked:dis, later:raw(watchLater), hist:raw(history_.slice(0,50))}},"*"); }catch(e){}
}
(function(){
  for(const fn of ["toggleSub","toggleLike","toggleDislike","toggleWatchLater"]){
    const orig = window[fn]; window[fn] = function(){ const r = orig.apply(this,arguments); if(window.API_MODE) apiPersist(); return r; };
  }
  const rw = window.renderWatch; window.renderWatch = function(id){ const before = history_.length; const r = rw(id); if(window.API_MODE && history_.length!==before) apiPersist(); return r; };
})();
window.addEventListener("message", e=>{
  if(e.source!==parent) return;
  const d = e.data; if(!d || d.bv!=="tube") return;
  if(d.type==="init"){
    window.API_MODE = true; document.body.classList.add("api"); NOTIFS.length = 0;
    API_STATUS = d.status || "ok";
    VIDEOS.length = 0; for(const k of Object.keys(API_ID)) delete API_ID[k];
    subscribedChannels.clear(); history_.length = 0; likedVideos.clear(); dislikedVideos.clear(); watchLater.clear();
    API_HOME = apiIds(d.home); API_RESULTS = [];
    const sv = d.saved || {};
    (Array.isArray(sv.subs)?sv.subs:[]).forEach(n=>{ const c = chanClean(n); subscribedChannels.add(c); if(!CHANNEL_COLORS[c]){ let h=0; for(const ch of c) h=(h*31+ch.charCodeAt(0))%360; CHANNEL_COLORS[c]=["hsl("+h+",65%,48%)","hsl("+((h+40)%360)+",70%,68%)"]; CHANNEL_SUBS[c]="—"; CHANNEL_ABOUT[c]={joined:"—",loc:"—",desc:"A channel from your YouTube results."}; } });
    const idOf = r=>{ const v = apiVideo(r); return v && v.id; };
    (Array.isArray(sv.liked)?sv.liked:[]).forEach(r=>{ const i=idOf(r); if(i) likedVideos.add(i); });
    (Array.isArray(sv.later)?sv.later:[]).forEach(r=>{ const i=idOf(r); if(i) watchLater.add(i); });
    (Array.isArray(sv.hist)?sv.hist:[]).forEach(r=>{ const i=idOf(r); if(i) history_.push(i); });
    (Array.isArray(sv.disliked)?sv.disliked:[]).forEach(y=>{ const v = API_ID[y]; if(v) dislikedVideos.add(v.id); });
    go("/home"); render();
  } else if(d.type==="results"){
    API_RESULTS = apiIds(d.videos); document.getElementById("searchInput").value = String(d.q||"").slice(0,200);
    go("/search/"+encodeURIComponent(String(d.q||"").slice(0,200)));
  } else if(d.type==="error"){
    showToast(String(d.message||"Something went wrong").slice(0,140)); if(currentView==="search") render();
  }
});
try{ parent.postMessage({bv:"tube-ready"},"*"); }catch(err){}
</script>
