      <h4>Still stuck?</h4>${btnDo("feedback-bug", "🐞 Report a problem", true)}` },
    { id: "contact", icon: "💬", title: "Send feedback or get in touch", tags: "feedback contact support bug report idea suggestion email", body: () => `
      <p>Found a bug, have an idea, or just like something? Tell us — it really helps.</p>
      ${btnDo("feedback", "💬 Send feedback", true)}${btnDo("feedback-bug", "🐞 Report a problem")}` },
  ];

  window.BV_APPS.push({
    id: "help", name: "Help", icon: "❓", bg: "linear-gradient(135deg,#38bdf8,#6366f1)", cat: "System", system: true, size: [640, 640],
    keywords: "help support guide faq how to tutorial manual",
    render(body, os, args) {
      let q = "", art = args?.article || null; const trail = [];
      const votes = () => store.get("helpVotes", {});
      const draw = () => {
        const a = ARTICLES.find(x => x.id === art);
        if (a) {
          const v = votes()[a.id];
          body.innerHTML = `<div class="hp-art"><button class="btn ghost" data-back>‹ ${trail.length ? "Back" : "All help"}</button>
            <h2>${a.icon} ${esc(a.title)}</h2>${a.body(os)}
            <div class="hp-vote"><span class="muted">Was this helpful?</span>
              <button class="btn ghost" data-vote="up" ${v === "up" ? 'style="outline:2px solid var(--accent)"' : ""}>👍 Yes</button>
              <button class="btn ghost" data-vote="down" ${v === "down" ? 'style="outline:2px solid var(--accent)"' : ""}>👎 No</button>
              ${v === "down" ? `<button class="btn" data-do="feedback-article">Tell us what was missing</button>` : v === "up" ? `<span class="muted">Thanks!</span>` : ""}</div></div>`;
          os.setTitle("help", "Help — " + a.title);
          return;
        }
        os.setTitle("help", "Help");
        const ql = q.toLowerCase().trim();
        const hits = ql ? ARTICLES.filter(x => (x.title + " " + x.tags).toLowerCase().includes(ql) || x.body(os).replace(/<[^>]+>/g, " ").toLowerCase().includes(ql)) : ARTICLES;
        body.innerHTML = `<input class="field hp-search" data-q placeholder="Search help — e.g. “exit”, “install”, “dark mode”" value="${esc(q)}" aria-label="Search help">
          ${ql ? "" : `<div class="hp-hero"><span>❓</span><div><b>How can we help?</b><small>Blockvile Plus ${esc(ver())} · ${esc(os.state.mode)} mode</small></div></div>
          <div class="hp-quick">
            <button data-goto="start"><span>👋</span>Getting started<small>The 1-minute tour</small></button>
            <button data-do="install"><span>📲</span>Install<small>${esc(os.installLabel())}</small></button>
            <button data-goto="exit"><span>⏏</span>Exit Blockvile<small>Back to your device</small></button>
            <button data-do="feedback"><span>💬</span>Send feedback<small>Bugs, ideas, praise</small></button>
          </div><div class="h">All topics</div>`}
          <div>${hits.map(x => `<button class="hp-row" data-goto="${x.id}"><span>${x.icon}</span><div><b>${esc(x.title)}</b></div></button>`).join("") || `<p class="muted center" style="padding:20px">No help topics match “${esc(q)}”.<br><br>${btnDo("feedback-question", "Ask a question")}</p>`}</div>`;
        const qi = body.querySelector("[data-q]"); qi.oninput = () => { q = qi.value; draw(); const n = body.querySelector("[data-q]"); n.focus(); n.setSelectionRange(q.length, q.length); };
      };
      body.addEventListener("click", e => {
        const g = e.target.closest("[data-goto]"); if (g) { if (art) trail.push(art); art = g.dataset.goto; draw(); body.scrollTop = 0; return; }
        if (e.target.closest("[data-back]")) { art = trail.pop() || null; draw(); return; }
        const o = e.target.closest("[data-open-app]"); if (o) return os.open(o.dataset.openApp);
        const v = e.target.closest("[data-vote]"); if (v) { const all = votes(); all[art] = v.dataset.vote; store.set("helpVotes", all); return draw(); }
        const d = e.target.closest("[data-do]")?.dataset.do; if (!d) return;
        const a = ARTICLES.find(x => x.id === art);
        if (d === "install") os.installApp();
        if (d === "feedback") os.open("feedback");
        if (d === "feedback-bug") os.open("feedback", { type: "bug" });
        if (d === "feedback-question") os.open("feedback", { type: "question", text: q ? `I was looking for help with: ${q}\n\n` : "" });
        if (d === "feedback-article" && a) os.open("feedback", { type: "question", text: `The help page “${a.title}” didn't answer my question.\n\nWhat I wanted to know: ` });
      });
      os.onBack("help", () => { if (art) { art = trail.pop() || null; draw(); return true; } if (q) { q = ""; draw(); return true; } });
      const onCh = () => { if (!body.contains(document.activeElement) || !/INPUT/.test(document.activeElement.tagName)) draw(); };
      window.addEventListener("bv:changed", onCh);
      draw();
      return () => window.removeEventListener("bv:changed", onCh);
    }
  });

  /* ================= Feedback ================= */
  const TYPES = { bug: ["🐞", "Problem"], idea: ["💡", "Idea"], praise: ["❤️", "Praise"], question: ["❓", "Question"] };
  const STATUS = { sent: "Sent", queued: "Will send when online", email: "Opened in email", saved: "Saved on this device" };

  function deviceInfo() {
    const os = window.BlockvileOS, ua = navigator.userAgent;
    const br = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Other";
    const plat = /Android/.test(ua) ? "Android" : /iPhone|iPad|iPod/.test(ua) ? "iOS" : /Windows/.test(ua) ? "Windows" : /Mac/.test(ua) ? "macOS" : /CrOS/.test(ua) ? "ChromeOS" : /Linux/.test(ua) ? "Linux" : "Other";
    const and = window.BV.android?.available ? window.BV.android.device() : null;
    return {
      version: ver(), mode: os?.state.mode, theme: document.documentElement.dataset.theme,
      platform: and ? `Android ${and.android} (${and.model})` : plat, browser: and ? "Blockvile Android app" : br,
      screen: `${screen.width}×${screen.height} @${devicePixelRatio || 1}x`, window: `${innerWidth}×${innerHeight}`,
      installed: os?.installLabel?.(), embedded: !!window.BV.embedded, language: navigator.language,
    };
  }
  // Attachments (pictures, text, logs, PDF): uploaded to the publisher's Supabase Storage bucket "feedback-files"
  const FILE_MAX = 5 * 1024 * 1024, FILE_COUNT = 3;
  const FTYPES = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", webp: "image/webp", gif: "image/gif", txt: "text/plain", log: "text/plain", json: "application/json", pdf: "application/pdf" };
  const ftype = f => FTYPES[(String(f.name).split(".").pop() || "").toLowerCase()] || "";
  const fsize = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const pendingFiles = new Map();
  const devText = d => Object.entries(d).map(([k, v]) => `${k}: ${v}`).join("\n");
  const asText = fb => [`Blockvile Plus feedback — ${TYPES[fb.type][1]}${fb.rating ? ` — ${"★".repeat(fb.rating)}${"☆".repeat(5 - fb.rating)}` : ""}`, "", fb.message,
    fb.contact ? `\nReply to: ${fb.contact}` : "", fb.files?.length ? `\nAttachments: ${fb.files.map(f => `${f.name} (${fsize(f.size)})`).join(", ")}` : "", fb.device ? `\n— Device —\n${devText(fb.device)}` : ""].join("\n").trim();

  // Feedback goes out by every route that's set up, and counts as sent if ANY of them takes it:
  //  1) the form service in config.js (arrives in the publisher's inbox, no email app needed)
  //  2) the publisher's Supabase "feedback" table (also works for people who aren't signed in)
  async function viaForm(fb) {
    const url = CFG().feedback?.endpoint; if (!url) return false;
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ type: TYPES[fb.type][1], rating: fb.rating || "", message: fb.message, email: fb.contact || "", device: fb.device ? devText(fb.device) : "", app: "Blockvile Plus " + ver(), attachments: fb.files?.length ? fb.files.map(f => f.name).join(", ") + " (uploaded to Supabase Storage → feedback-files)" : "",
          _subject: `Blockvile feedback: ${TYPES[fb.type][1]}`, _template: "table", _captcha: "false", ...(fb.contact ? { _replyto: fb.contact } : {}) }) });
      if (!r.ok) return false;
      try { const j = await r.json(); if (j && (j.success === false || j.success === "false")) return false; } catch { }
      return true;
    } catch { return false; }
  }
  async function viaSupabase(fb) {
    const A = window.BV.auth; if (!A?.configured?.()) return false;
    try {
      const c = await A.client();
      const paths = [], objs = pendingFiles.get(fb.id) || [];
      for (let i = 0; i < objs.length; i++) {
        const f = objs[i], path = `${fb.id}/${i + 1}-${f.name.replace(/[^\w.\-]+/g, "_").slice(-80)}`;
        try { const up = await c.storage.from("feedback-files").upload(path, f, { contentType: ftype(f) || f.type || "application/octet-stream", upsert: false }); if (up.error) fb.fileError = true; else paths.push(path); } catch { fb.fileError = true; }
      }
      const row = { type: TYPES[fb.type][1], rating: fb.rating || null, message: fb.message.slice(0, 4000), contact: (fb.contact || "").slice(0, 200) || null,
        device: fb.device ? devText(fb.device).slice(0, 1500) : null, app_version: ver() };
      if (paths.length) row.files = paths;
      let { error } = await c.from("feedback").insert(row);
      if (error && row.files) { delete row.files; fb.fileError = true; ({ error } = await c.from("feedback").insert(row)); }   // an older database without the files column still gets the message
      if (!error && !fb.fileError) pendingFiles.delete(fb.id);
      return !error;
    } catch { return false; }
  }
  async function postFeedback(fb) {
    if (!CFG().feedback?.endpoint && !window.BV.auth?.configured?.()) return false;
    const [a, b] = await Promise.all([viaForm(fb), viaSupabase(fb)]);
    return a || b;
  }
  function openEmail(fb) {
    const to = CFG().feedback?.email; if (!to) return false;
    const href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(`Blockvile Plus feedback: ${TYPES[fb.type][1]}`)}&body=${encodeURIComponent(asText(fb))}`;
    if (window.BV.android?.available) { window.open(href); return true; }
    try { const a = document.createElement("a"); a.href = href; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); return true; } catch { return false; }
  }
  const history = () => store.get("feedbackSent", []);
  const saveHistory = h => store.set("feedbackSent", h.slice(0, 30));
  async function flushQueue() { // retry feedback that couldn't be sent while offline
    const h = history(); let changed = false;
    for (const fb of h.filter(x => x.status === "queued")) if (await postFeedback(fb)) { fb.status = "sent"; changed = true; }
    if (changed) { saveHistory(h); window.BlockvileOS?.toast("💬 Your saved feedback was sent — thank you!"); window.dispatchEvent(new Event("bv:feedback")); }
  }
  window.addEventListener("online", flushQueue);
  setTimeout(() => { if (navigator.onLine) flushQueue(); }, 6000);

  window.BV_APPS.push({
    id: "feedback", name: "Feedback", icon: "💬", bg: "linear-gradient(135deg,#f59e0b,#ef4444)", cat: "System", system: true, size: [560, 680],
    keywords: "feedback bug report idea suggestion contact support rate review",
    render(body, os, args) {
      let view = "form", type = args?.type || "idea", rating = 0, last = null, includeDev = true;
      let files = Array.isArray(args?.files) ? args.files.filter(f => f && ftype(f) && f.size <= FILE_MAX).slice(0, FILE_COUNT) : [];
      let draft = store.get("feedbackDraft", { message: "", contact: "" });
      if (args?.text) draft.message = args.text + (draft.message && !draft.message.startsWith(args.text) ? "" : "");
      const configured = () => !!(CFG().feedback?.endpoint || CFG().feedback?.email || window.BV.auth?.configured?.());
      const draw = () => {
        if (view === "done") {
          const s = last.status;
          body.innerHTML = `<div class="fb-done"><div>${s === "saved" ? "📝" : "💚"}</div>
            <h3>${s === "sent" ? "Thanks — your feedback was sent!" : s === "queued" ? "Saved — it'll send when you're back online" : s === "email" ? "Your email app should open now" : "Thanks! Your feedback is saved"}</h3>
            <p class="muted" style="margin:8px 0 16px">${s === "email" ? "Press Send in your email app to deliver it. Didn't open? Copy it instead." : s === "saved" ? "This copy of Blockvile isn't set up to send feedback yet. You can copy it or save it as a file to share." : "We read every message."}</p>
            <div class="row" style="justify-content:center;flex-wrap:wrap">${s === "email" || s === "saved" ? `<button class="btn" data-copy>📋 Copy feedback</button><button class="btn ghost" data-file>💾 Save as file</button>` : ""}
            <button class="btn ghost" data-new>Send more</button><button class="btn ghost" data-hist>History</button></div></div>`;
          return;
        }
        if (view === "history") {
          const h = history();
          body.innerHTML = `<button class="btn ghost" data-form>‹ New feedback</button><div class="h" style="margin-top:14px">Your feedback</div>
            ${h.length ? h.map(f => `<div class="fb-hist"><span>${TYPES[f.type][0]}</span><div><b>${esc(f.message.split("\n")[0] || "(no text)")}${f.files?.length ? ` 📎${f.files.length}` : ""}</b><small>${new Date(f.time).toLocaleString()}</small></div><span class="fb-tag ${f.status}">${STATUS[f.status]}</span></div>`).join("")
              : `<p class="muted center" style="padding:20px">Nothing sent yet.</p>`}
            ${h.some(f => f.status === "queued") ? `<button class="btn" data-retry>Try sending again</button>` : ""}`;
          return;
        }
        const dev = deviceInfo();
        body.innerHTML = `<form class="fb-form" data-fbform>
          <div class="fb-types">${Object.entries(TYPES).map(([k, [ic, l]]) => `<button type="button" data-type="${k}" class="${type === k ? "on" : ""}"><span>${ic}</span>${l}</button>`).join("")}</div>
          <label>How are you finding Blockvile?</label>
          <div class="fb-stars" role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-star="${n}" class="${n <= rating ? "on" : ""}" aria-label="${n} star${n > 1 ? "s" : ""}">⭐</button>`).join("")}</div>
          <label for="fb-msg">${{ bug: "What went wrong? What did you expect to happen?", idea: "What would make Blockvile better?", praise: "What do you like?", question: "What's your question?" }[type]}</label>
          <textarea id="fb-msg" class="field" data-msg maxlength="5000" placeholder="${{ bug: "e.g. When I open YouTube in tablet mode, the player…", idea: "e.g. It would be great if…", praise: "e.g. I love the laptop mode because…", question: "Ask anything…" }[type]}">${esc(draft.message)}</textarea>
          <label for="fb-files">Attach screenshots or files (optional)</label>
          <input id="fb-files" class="field" data-attach type="file" multiple accept="image/*,.txt,.log,.json,.pdf">
          <div class="fb-files">${files.map((f, i) => `<div class="fb-file"><span>📎 ${esc(f.name)} · ${fsize(f.size)}</span><button type="button" class="link-btn" data-rmf="${i}">Remove</button></div>`).join("")}</div>
          <small class="muted">Up to ${FILE_COUNT} files, 5 MB each: pictures, .txt, .log, .json or .pdf. They are sent with your message.</small>
          <label for="fb-contact">Email for a reply (optional)</label>
          <input id="fb-contact" class="field" data-contact type="email" placeholder="you@example.com" value="${esc(draft.contact)}" autocomplete="email">
          <label class="fb-check"><input type="checkbox" data-dev ${includeDev ? "checked" : ""}><span>Include device details — helps fix problems. <button type="button" class="link-btn" data-showdev>See what's included</button>
            <div class="fb-dev" data-devbox hidden>${esc(devText(dev))}</div></span></label>
          <div class="row" style="justify-content:space-between;flex-wrap:wrap"><button type="button" class="btn ghost" data-hist>History (${history().length})</button><button class="btn" data-send>Send feedback</button></div>
          ${configured() ? "" : `<p class="muted" style="font-size:11px;margin-top:10px">Feedback delivery isn't set up in this copy yet, so it's saved here and you can copy or share it. (Publisher: set it in js/config.js.)</p>`}
        </form>`;
      };
      const keepDraft = () => {
        const m = body.querySelector("[data-msg]"), c = body.querySelector("[data-contact]");
        if (m) draft = { message: m.value, contact: c.value }; store.set("feedbackDraft", draft);
      };
      body.addEventListener("input", keepDraft);
      body.addEventListener("change", e => {
        if (e.target.matches("[data-dev]")) includeDev = e.target.checked;
        if (e.target.matches("[data-attach]")) {
          keepDraft(); let bad = 0;
          for (const f of e.target.files) { if (!ftype(f) || f.size > FILE_MAX || files.length >= FILE_COUNT) bad++; else files.push(f); }
          if (bad) os.toast(`Some files weren't added (max ${FILE_COUNT} files, 5 MB, pictures/.txt/.log/.json/.pdf)`);
          draw();
        }
      });
      body.addEventListener("click", async e => {
        const t = e.target.closest("[data-type]"); if (t) { keepDraft(); type = t.dataset.type; return draw(); }
        const st = e.target.closest("[data-star]"); if (st) { keepDraft(); rating = +st.dataset.star; return draw(); }
        const rf = e.target.closest("[data-rmf]"); if (rf) { keepDraft(); files.splice(+rf.dataset.rmf, 1); return draw(); }
        if (e.target.closest("[data-showdev]")) { const b = body.querySelector("[data-devbox]"); b.hidden = !b.hidden; return; }
        if (e.target.closest("[data-hist]")) { view = "history"; return draw(); }
        if (e.target.closest("[data-form]") || e.target.closest("[data-new]")) { view = "form"; rating = 0; return draw(); }
        if (e.target.closest("[data-retry]")) { await flushQueue(); return draw(); }
        if (e.target.closest("[data-copy]") && last) { try { await navigator.clipboard.writeText(asText(last)); os.toast("📋 Copied"); } catch { os.toast("Couldn't copy — use Save as file"); } return; }
        if (e.target.closest("[data-file]") && last) return window.BV.download(new Blob([asText(last)], { type: "text/plain" }), `blockvile-feedback-${new Date().toISOString().slice(0, 10)}.txt`);
      });
      body.addEventListener("submit", async e => {
        e.preventDefault(); keepDraft();
        const message = draft.message.trim();
        if (message.length < 3) { os.toast("Please write a few words first"); body.querySelector("[data-msg]")?.focus(); return; }
        const contact = draft.contact.trim();
        if (contact && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)) { os.toast("That email address doesn't look right"); return; }
        const fb = { id: uid(), time: Date.now(), type, rating, message, contact, device: includeDev ? deviceInfo() : null, status: "saved", files: files.map(f => ({ name: f.name, size: f.size })) };
        if (files.length) pendingFiles.set(fb.id, files.slice());
        const btn = body.querySelector("[data-send]"); if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
        if (CFG().feedback?.endpoint || window.BV.auth?.configured?.()) fb.status = navigator.onLine === false ? "queued" : (await postFeedback(fb)) ? "sent" : (CFG().feedback?.email && openEmail(fb) ? "email" : "queued");
        else if (openEmail(fb)) fb.status = "email";
        saveHistory([fb, ...history()]);
        if (fb.files.length) os.toast(fb.status === "sent" && !fb.fileError ? `📎 ${fb.files.length} file${fb.files.length > 1 ? "s" : ""} sent` : fb.status === "sent" ? "Message sent, but the files couldn't be uploaded" : "Files are only sent with the online feedback route — try again when online");
        files = [];
        draft = { message: "", contact }; store.set("feedbackDraft", draft);
        last = fb; view = "done"; draw();
      });
      const onFb = () => view === "history" && draw();
      window.addEventListener("bv:feedback", onFb);
      os.onBack("feedback", () => { if (view !== "form") { view = "form"; draw(); return true; } });
      draw();
      return () => window.removeEventListener("bv:feedback", onFb);
    }
  });
})();

</script>
  <script>/* js/accounts.js */
/* Blockvile Plus OS — accounts: sign in with Google, Microsoft or any email (Supabase), link this device,
   and open / read your Google and Microsoft services. Powers BV.auth, used by the Digital SIM and Blockvile AI. */
(() => {
  const { esc, store } = window.BV;
  const CFG = () => window.BV_CONFIG || {};
  const LIB = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
  const isAndroid = () => !!window.BV.android?.available;

  /* ---------- tiny helpers ---------- */
  const ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch { } } };
  const emit = () => window.dispatchEvent(new Event("bv:auth"));

  /* ---------- Supabase settings: the publisher's config.js wins; otherwise what the user pasted in Accounts → Setup ---------- */
  const settings = () => {
    const c = CFG().supabase || {}, fromConfig = !!(c.url && c.anonKey);
    // When the publisher's config.js has a project, sign-in ALWAYS uses that one (never a project someone typed in or an old saved one).
    if (fromConfig) { if (store.get("supabaseCfg", null)) store.del("supabaseCfg"); return { url: c.url.trim().replace(/\/+$/, ""), key: c.anonKey.trim(), fn: c.aiFunction || "blockvile-ai", yt: c.youtubeFunction || "blockvile-youtube", fromConfig: true }; }
    const mine = store.get("supabaseCfg", {});
    return { url: (mine.url || "").trim().replace(/\/+$/, ""), key: (mine.anonKey || "").trim(), fn: c.aiFunction || "blockvile-ai", yt: c.youtubeFunction || "blockvile-youtube", fromConfig: false };
  };
  const validUrl = u => /^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(u);
  const configured = () => { const s = settings(); return validUrl(s.url) && s.key.length > 20 && !/service_role/i.test(s.key); };

  /* ---------- load the Supabase library only when it's needed ---------- */
  let libPromise = null, sb = null;
  const loadLib = () => libPromise || (libPromise = new Promise((res, rej) => {
    if (window.supabase?.createClient) return res();
    const el = document.createElement("script"); el.src = LIB; el.async = true;
    el.onload = () => (window.supabase?.createClient ? res() : rej(new Error("Sign-in library didn't start")));
    el.onerror = () => { libPromise = null; rej(new Error("Couldn't load the sign-in library — check your internet connection")); };
    document.head.appendChild(el);
  }));
  const storage = { getItem: k => store.get("sb:" + k, null), setItem: (k, v) => store.set("sb:" + k, v), removeItem: k => store.set("sb:" + k, null) };
  async function client() {
    if (!configured()) throw new Error("Sign-in isn't set up yet — open Accounts → Setup");
    if (sb) return sb;
    await loadLib();
    const s = settings();
    sb = window.supabase.createClient(s.url, s.key, { auth: { storage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, flowType: "pkce" } });
    sb.auth.onAuthStateChange((ev, session) => {
      if (session?.provider_token) { ss.set("bv:ptoken", session.provider_token); ss.set("bv:pprovider", session.user?.app_metadata?.provider || ""); }
      if (ev === "PASSWORD_RECOVERY") { auth.recovering = true; window.BlockvileOS?.open("accounts"); }
      auth.user = session?.user || null; auth.session = session || null; syncApps(); emit();
    });
    return sb;
  }

  /* ---------- the public auth object ---------- */
  const redirectTo = () => isAndroid() ? "blockvile://auth" : location.origin + location.pathname;
  const canRedirect = () => isAndroid() || /^https?:$/.test(location.protocol);
  const auth = {
    user: null, session: null, recovering: false,
    configured, settings,
    signedIn: () => !!auth.user,
    email: () => auth.user?.email || "",
    name: () => auth.user?.user_metadata?.full_name || auth.user?.user_metadata?.name || (auth.user?.email || "").split("@")[0],
    provider: () => auth.user?.app_metadata?.provider || "email",
    providerToken: () => ss.get("bv:ptoken"),
    providerOfToken: () => ss.get("bv:pprovider"),
    client,
    async init() {
      if (!configured()) return;
      const c = await client();
      const { data } = await c.auth.getSession();
      auth.user = data.session?.user || null; auth.session = data.session || null; syncApps(); emit();
      // Returning from Google / Microsoft in a normal browser
      const u = new URL(location.href);
      if (u.searchParams.get("code") && !isAndroid()) await auth.deepLink(location.href, true);
      const pending = window.__bvDeep || window.BV.android?.pendingDeepLink?.();
      if (pending) await auth.deepLink(pending);
    },
    // Called when Google/Microsoft sends the user back (browser address, or blockvile://auth on Android)
    async deepLink(url, clean) {
      try {
        const c = await client(), u = new URL(url), code = u.searchParams.get("code");
        const err = u.searchParams.get("error_description") || u.searchParams.get("error");
        if (err) throw new Error(err);
        if (code) { const { error } = await c.auth.exchangeCodeForSession(code); if (error) throw error; window.BlockvileOS?.toast("✅ Signed in"); }
      } catch (e) { window.BlockvileOS?.toast("⚠️ " + (e.message || "Sign-in didn't finish")); }
      finally { window.__bvDeep = null; if (clean) try { history.replaceState(null, "", location.pathname); } catch { } }
    },
    async signUp(email, password, name) {
      const c = await client();
      const { data, error } = await c.auth.signUp({ email, password, options: { data: { full_name: name || "" }, emailRedirectTo: redirectTo() } });
      if (error) throw error;
      return { needsConfirm: !data.session };
    },
    async newPassword(password) { const c = await client(); const { error } = await c.auth.updateUser({ password }); if (error) throw error; auth.recovering = false; },
    async signIn(email, password) { const c = await client(); const { error } = await c.auth.signInWithPassword({ email, password }); if (error) throw error; },
    async reset(email) { const c = await client(); const { error } = await c.auth.resetPasswordForEmail(email, { redirectTo: redirectTo() }); if (error) throw error; },
    // provider: "google" | "azure" | "github". "extra" asks for permission to read mail, calendar and files too.
    async oauth(provider, extra) {
      if (!canRedirect()) throw new Error("Google, Microsoft and GitHub sign-in need the hosted website or the Android app (not a file opened from your computer)");
      const c = await client(), gh = provider === "github", p = gh ? null : SERVICES[provider === "azure" ? "microsoft" : "google"];
      const { data, error } = await c.auth.signInWithOAuth({
        provider, options: {
          redirectTo: redirectTo(), skipBrowserRedirect: true,
          scopes: gh ? "read:user user:email" : extra ? p.scopes.join(" ") : p.basic.join(" "),
          queryParams: gh ? {} : provider === "google" ? { access_type: "offline", prompt: "consent" } : { prompt: "select_account" },
        }
      });
      if (error) throw error;
      // Google refuses to load inside a frame or an app's built-in browser, so it always opens on its own
      if (isAndroid() || BV.embedded) window.open(data.url, "_blank", "noopener"); else location.assign(data.url);
    },
    async signOut() {
      try { const c = await client(); await c.auth.signOut(); } catch { }
      auth.user = null; auth.session = null; ss.set("bv:ptoken", null); ss.set("bv:pprovider", null); syncApps(); emit();
    },
  };

  /* ---------- Google & Microsoft services ---------- */
  const SERVICES = {
    google: {
      name: "Google", icon: "🟦", provider: "google",
      basic: ["openid", "email", "profile"],
      scopes: ["openid", "email", "profile", "https://www.googleapis.com/auth/gmail.readonly", "https://www.googleapis.com/auth/calendar.readonly", "https://www.googleapis.com/auth/drive.readonly"],
      apps: [
        ["📧", "Gmail", "com.google.android.gm", "https://mail.google.com/"], ["📁", "Drive", "com.google.android.apps.docs", "https://drive.google.com/"],
        ["📄", "Docs", "com.google.android.apps.docs.editors.docs", "https://docs.google.com/document/"], ["📊", "Sheets", "com.google.android.apps.docs.editors.sheets", "https://docs.google.com/spreadsheets/"],
        ["📽", "Slides", "com.google.android.apps.docs.editors.slides", "https://docs.google.com/presentation/"], ["📅", "Calendar", "com.google.android.calendar", "https://calendar.google.com/"],
        ["🎥", "Meet", "com.google.android.apps.tachyon", "https://meet.google.com/"], ["🖼", "Photos", "com.google.android.apps.photos", "https://photos.google.com/"],
        ["🗺", "Maps", "com.google.android.apps.maps", "https://maps.google.com/"], ["▶️", "YouTube", "com.google.android.youtube", "https://www.youtube.com/"],
        ["👥", "Contacts", "com.google.android.contacts", "https://contacts.google.com/"], ["🗒", "Keep", "com.google.android.keep", "https://keep.google.com/"],
        ["🌐", "Translate", "com.google.android.apps.translate", "https://translate.google.com/"], ["👤", "My Account", "", "https://myaccount.google.com/"],
      ],
    },
    microsoft: {
      name: "Microsoft", icon: "🟧", provider: "azure",
      basic: ["openid", "email", "profile", "offline_access"],
      scopes: ["openid", "email", "profile", "offline_access", "User.Read", "Mail.Read", "Calendars.Read", "Files.Read"],
      apps: [
        ["📧", "Outlook", "com.microsoft.office.outlook", "https://outlook.live.com/mail/"], ["☁️", "OneDrive", "com.microsoft.skydrive", "https://onedrive.live.com/"],
        ["📄", "Word", "com.microsoft.office.word", "https://www.office.com/launch/word"], ["📊", "Excel", "com.microsoft.office.excel", "https://www.office.com/launch/excel"],
        ["📽", "PowerPoint", "com.microsoft.office.powerpoint", "https://www.office.com/launch/powerpoint"], ["💬", "Teams", "com.microsoft.teams", "https://teams.microsoft.com/"],
        ["📓", "OneNote", "com.microsoft.office.onenote", "https://www.onenote.com/notebooks"], ["✅", "To Do", "com.microsoft.todos", "https://to-do.live.com/"],
        ["📅", "Calendar", "com.microsoft.office.outlook", "https://outlook.live.com/calendar/"], ["👥", "People", "", "https://outlook.live.com/people/"],
        ["🧩", "Microsoft 365", "com.microsoft.office.officehubrow", "https://www.office.com/"], ["👤", "My Account", "", "https://account.microsoft.com/"],
      ],
    },
  };
  // Opens the real app on Android if it's installed, otherwise the website
  function openService(pkg, url) {
    const a = window.BV.android;
    if (a?.available && pkg && a.installed(pkg)) return a.launch(pkg);
    window.BV.openWeb(url);   // websites open inside Blockvile
  }
  // What we can read once the user has allowed it (token lives for this visit only and is never saved)
  async function get(url, token) {
    const r = await fetch(url, { headers: { Authorization: "Bearer " + token } });
    if (r.status === 401 || r.status === 403) throw new Error("denied");
    if (!r.ok) throw new Error("failed");
    return r.json();
  }
  const DATA = {
    google: async t => {
      const [mail, cal, drv] = await Promise.allSettled([
        get("https://gmail.googleapis.com/gmail/v1/users/me/labels/INBOX", t),
        get("https://www.googleapis.com/calendar/v3/calendars/primary/events?maxResults=4&singleEvents=true&orderBy=startTime&timeMin=" + encodeURIComponent(new Date().toISOString()), t),
        get("https://www.googleapis.com/drive/v3/files?pageSize=4&orderBy=modifiedTime%20desc&fields=files(id,name,webViewLink)", t)]);
      const v = x => x.status === "fulfilled" ? x.value : null;
      return {
        unread: v(mail)?.messagesUnread ?? null,
        events: (v(cal)?.items || []).map(e => ({ title: e.summary || "(no title)", when: e.start?.dateTime || e.start?.date, url: e.htmlLink })),
        files: (v(drv)?.files || []).map(f => ({ title: f.name, url: f.webViewLink })),
        denied: [mail, cal, drv].every(x => x.status === "rejected"),
      };
    },
    microsoft: async t => {
      const now = new Date(), end = new Date(now.getTime() + 7 * 864e5);
      const [mail, cal, drv] = await Promise.allSettled([
        get("https://graph.microsoft.com/v1.0/me/mailFolders/inbox?$select=unreadItemCount", t),
        get(`https://graph.microsoft.com/v1.0/me/calendarview?startdatetime=${now.toISOString()}&enddatetime=${end.toISOString()}&$top=4&$orderby=start/dateTime&$select=subject,start,webLink`, t),
        get("https://graph.microsoft.com/v1.0/me/drive/recent?$top=4", t)]);
      const v = x => x.status === "fulfilled" ? x.value : null;
      return {
        unread: v(mail)?.unreadItemCount ?? null,
        events: (v(cal)?.value || []).map(e => ({ title: e.subject || "(no title)", when: e.start?.dateTime ? e.start.dateTime + "Z" : "", url: e.webLink })),
        files: (v(drv)?.value || []).map(f => ({ title: f.name, url: f.webUrl })),
        denied: [mail, cal, drv].every(x => x.status === "rejected"),
      };
    },
  };

  /* ---------- link this device to the account ---------- */
  const deviceKey = () => { let k = store.get("deviceKey", ""); if (!k) { k = (crypto.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2)); store.set("deviceKey", k); } return k; };
  const deviceName = () => {
    const d = window.BV.android?.device?.() || {};
    if (d.model) return d.model;
    const ua = navigator.userAgent;
    const os = /Windows/.test(ua) ? "Windows" : /Android/.test(ua) ? "Android" : /iPhone|iPad/.test(ua) ? "iOS" : /Mac OS/.test(ua) ? "Mac" : /CrOS/.test(ua) ? "Chromebook" : /Linux/.test(ua) ? "Linux" : "device";
    const br = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "browser";
    return `${os} · ${br}`;
  };
  const devices = {
    async list() { const c = await client(); const { data, error } = await c.from("devices").select("*").order("last_seen", { ascending: false }); if (error) throw error; return data; },
    async link() {
      const c = await client();
      const { error } = await c.from("devices").upsert({ user_id: auth.user.id, device_key: deviceKey(), name: deviceName(), platform: isAndroid() ? "android" : "web", last_seen: new Date().toISOString() }, { onConflict: "user_id,device_key" });
      if (error) throw error; store.set("deviceLinked:" + auth.user.id, true);
    },
    async unlink(id) { const c = await client(); const { error } = await c.from("devices").delete().eq("id", id); if (error) throw error; },
    isThis: d => d.device_key === deviceKey(),
    isLinked: () => !!(auth.user && store.get("deviceLinked:" + auth.user.id, false)),
    async touch() { if (devices.isLinked()) try { await devices.link(); } catch { } },
  };

  /* ---------- the Digital SIM only exists while signed in ---------- */
  function syncApps() {
    const os = window.BlockvileOS; if (!os?.registerApp) return;
    const has = !!os.apps().find(a => a.id === "sim");
    if (auth.user && !has) os.registerApp(SIM_APP());
    if (!auth.user && has) os.unregisterApp("sim");
  }

  window.BV.auth = auth; window.BV.services = { SERVICES, openService, DATA, devices, deviceName, deviceKey };
  window.BV.accountsInternals = { SIM_APP: null };
  const SIM_APP = () => window.BV.simApp;

  /* ================= Accounts app ================= */
  window.BV_APPS.push({
    id: "accounts", name: "Accounts", icon: "👤", bg: "linear-gradient(135deg,#6366f1,#22d3ee)", cat: "System", system: true, size: [520, 600],
    keywords: "account sign in login google microsoft email supabase link device gmail outlook onedrive drive services",
    render(body, os, args) {
      let draft = null, tab = args?.tab || "in", busy = false, note = "", devs = null, svcData = {}, setup = false;
      const flash = (m, bad) => { note = (bad ? "⚠️ " : "") + m; draw(); };
      const btn = (act, label, cls = "") => `<button class="btn ${cls}" data-do="${act}" ${busy ? "disabled" : ""}>${label}</button>`;
      const err = e => /Invalid login/i.test(e?.message) ? "Wrong email or password" : (e?.message || String(e));

      const setupBox = () => `<details class="ac-setup" ${setup || !auth.configured() ? "open" : ""}><summary><b>Setup</b> — connect your Supabase project</summary>
        <p class="muted" style="font-size:13px">Make a free project at supabase.com, run <code>supabase/schema.sql</code> in its SQL Editor, then paste the two values from <b>Project Settings → API</b>. Use the <b>anon / publishable</b> key — never the service_role key.</p>
        ${auth.settings().fromConfig ? `<p class="muted">✅ Set by the publisher of this copy of Blockvile.</p>` : `
          <input class="field" data-su placeholder="Project URL  https://xxxx.supabase.co" value="${esc(draft ? draft.url : auth.settings().url)}" style="margin-bottom:8px">
          <input class="field" data-sk placeholder="anon / publishable key" value="${esc(draft ? draft.key : auth.settings().key)}" style="margin-bottom:8px">
          ${btn("savecfg", "Save")}`}
        <p class="muted" style="font-size:12px;margin-top:10px">For Google/Microsoft/GitHub sign-in, turn the providers on in Supabase → Authentication → Providers, and add <code>${esc(redirectTo())}</code> to Redirect URLs.</p></details>`;

      const signedOut = () => `
        <div class="seg"><button data-tab="in" class="${tab === "in" ? "on" : ""}">Sign in</button><button data-tab="up" class="${tab === "up" ? "on" : ""}">Create account</button></div>
        <div class="ac-oauth">
          <button class="btn ghost ac-g" data-do="google" ${busy ? "disabled" : ""}><b style="color:#4285f4">G</b> Continue with Google</button>
          <button class="btn ghost ac-m" data-do="azure" ${busy ? "disabled" : ""}><b style="color:#f25022">▪</b> Continue with Microsoft</button>
          <button class="btn ghost ac-h" data-do="github" ${busy ? "disabled" : ""}><b>🐙</b> Continue with GitHub</button>
        </div>
        <p class="muted" style="text-align:center;margin:14px 0">or use any email address</p>
        <form data-form>
          ${tab === "up" ? `<input class="field" name="name" placeholder="Your name" autocomplete="name" style="margin-bottom:8px">` : ""}
          <input class="field" name="email" type="email" placeholder="Email (Gmail, Outlook, your own…)" autocomplete="email" required style="margin-bottom:8px">
          <input class="field" name="password" type="password" placeholder="Password${tab === "up" ? " (at least 8 characters)" : ""}" autocomplete="${tab === "up" ? "new-password" : "current-password"}" minlength="${tab === "up" ? 8 : 1}" required style="margin-bottom:12px">
          <button class="btn" style="width:100%" ${busy ? "disabled" : ""}>${tab === "up" ? "Create account" : "Sign in"}</button>
          ${tab === "in" ? `<button type="button" class="link-btn" data-do="forgot" style="margin-top:10px">Forgot password?</button>` : ""}
        </form>
        <p class="muted" style="font-size:12px;margin-top:12px">Signing in unlocks your <b>Digital SIM</b> and cloud features. Without an account, everything else in Blockvile still works.</p>`;

      const svcCard = key => {
        const S = SERVICES[key], linked = auth.providerOfToken() === S.provider && auth.providerToken(), d = svcData[key];
        const when = t => { const x = new Date(t); return isNaN(x) ? "" : x.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }); };
        return `<div class="ac-svc"><h4>${S.icon} ${S.name} services</h4>
          <div class="ac-tiles">${S.apps.map(([ic, n, pkg, url]) => `<button class="ac-tile" data-svc="${key}" data-n="${esc(n)}"><span>${ic}</span>${esc(n)}</button>`).join("")}</div>
          ${linked ? (d ? (d.denied ? `<p class="muted">Couldn't read your ${S.name} data. Link again to allow it.</p>` : `
            <div class="list" style="margin-top:10px">
              <div><span>📧 Unread mail</span><b>${d.unread ?? "–"}</b></div>
              ${d.events.map(e => `<div data-url="${esc(e.url || "")}"><span>📅 ${esc(e.title)}</span><small>${esc(when(e.when))}</small></div>`).join("") || `<div><span class="muted">No upcoming events</span></div>`}
              ${d.files.map(f => `<div data-url="${esc(f.url || "")}"><span>📄 ${esc(f.title)}</span><small>open</small></div>`).join("")}
            </div>`) : `<p class="muted">Loading…</p>`)
            : `<button class="btn ghost" data-do="link-${S.provider}" style="margin-top:10px;width:100%" ${busy ? "disabled" : ""}>🔗 Link ${S.name} mail, calendar &amp; files</button>
               <p class="muted" style="font-size:12px;margin:6px 0 0">You choose what to allow on ${S.name}'s own page. Blockvile only reads, never sends or deletes, and doesn't keep the access after you close it.</p>`}</div>`;
      };

      const recovery = () => `<p><b>Choose a new password</b></p><form data-newpw><input class="field" name="pw" type="password" minlength="8" placeholder="New password (at least 8 characters)" autocomplete="new-password" required style="margin-bottom:12px"><button class="btn" style="width:100%">Save new password</button></form>`;
      const signedIn = () => `
        <div class="ac-me"><div class="ac-av">${esc((auth.name() || "?")[0].toUpperCase())}</div>
          <div style="flex:1;min-width:0"><b>${esc(auth.name())}</b><br><small class="muted">${esc(auth.email())} · ${esc(auth.provider() === "azure" ? "Microsoft" : auth.provider() === "github" ? "GitHub" : auth.provider())}</small></div>
          ${btn("signout", "Sign out", "ghost")}</div>
        <div class="list" style="margin-top:14px">
          <button data-do="opensim"><span><b>📶 Digital SIM</b><br><small>Your Blockvile number — charges on Wi-Fi</small></span><small>›</small></button>
          <button data-do="openai"><span><b>✨ Blockvile AI</b><br><small>Ask anything or tell your device what to do</small></span><small>›</small></button>
        </div>
        <div class="ac-svc"><h4>📱 This device</h4>
          ${devs == null ? `<p class="muted">Loading…</p>` : `<div class="list">${devs.map(d => `<div><span>${d.platform === "android" ? "📱" : "💻"} ${esc(d.name)}${devices.isThis(d) ? ` <small>(this device)</small>` : ""}<br><small>Last seen ${new Date(d.last_seen).toLocaleDateString()}</small></span>${devices.isThis(d) ? "" : `<button class="btn ghost" style="padding:6px 10px" data-unlink="${d.id}">Unlink</button>`}</div>`).join("") || `<div><span class="muted">No linked devices yet</span></div>`}</div>`}
          ${devs && !devs.some(devices.isThis) ? btn("linkdev", "🔗 Link this device to my account") : `<p class="muted" style="font-size:12px">Linked devices share your account and SIM. Unlink any time.</p>`}
        </div>
        ${svcCard("google")}${svcCard("microsoft")}`;

      const draw = () => {
        body.innerHTML = `<div class="ac">${note ? `<div class="tip" style="margin-bottom:12px">${esc(note)}</div>` : ""}
          ${auth.user && auth.recovering ? recovery() : auth.user ? signedIn() : auth.configured() ? signedOut() : `<p>Sign in to unlock your <b>Digital SIM</b> and cloud features.</p>`}
          ${setupBox()}</div>`;
      };
      const load = async () => {
        if (!auth.user) return;
        try { devs = await devices.list(); await devices.touch(); } catch (e) { devs = []; note = "⚠️ Run supabase/schema.sql in your Supabase project (devices table missing)"; }
        draw();
        for (const k of ["google", "microsoft"]) {
          const t = auth.providerToken();
          if (t && auth.providerOfToken() === SERVICES[k].provider && !svcData[k]) { DATA[k](t).then(d => { svcData[k] = d; draw(); }).catch(() => { svcData[k] = { denied: true }; draw(); }); }
        }
      };
      const run = async fn => { busy = true; note = ""; draw(); try { await fn(); } catch (e) { note = "⚠️ " + err(e); } busy = false; draw(); };

      body.addEventListener("click", e => {
        const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; note = ""; return draw(); }
        const svc = e.target.closest("[data-svc]");
        if (svc) { const row = SERVICES[svc.dataset.svc].apps.find(a => a[1] === svc.dataset.n); return openService(row[2], row[3]); }
        const u = e.target.closest("[data-url]"); if (u && u.dataset.url) return window.BV.openWeb(u.dataset.url);
        const ul = e.target.closest("[data-unlink]"); if (ul) return run(async () => { await devices.unlink(ul.dataset.unlink); devs = await devices.list(); });
        const b = e.target.closest("[data-do]"); if (!b) return;
        const act = b.dataset.do;
        if (act === "savecfg") {
          const url = body.querySelector("[data-su]").value.trim().replace(/\/+$/, ""), key = body.querySelector("[data-sk]").value.trim();
          draft = { url, key };
          if (!validUrl(url)) return flash("That doesn't look like a Supabase project URL (https://xxxx.supabase.co)", true);
          if (/service_role/i.test(key) || key.length < 20) return flash("Use the anon / publishable key (not the service_role key)", true);
          store.set("supabaseCfg", { url, anonKey: key }); sb = null; setup = false; draft = null;
          return run(async () => { await auth.init(); note = "✅ Saved"; });
        }
        if (act === "google" || act === "azure" || act === "github") return run(() => auth.oauth(act, false));
        if (act === "link-google" || act === "link-azure") return run(() => auth.oauth(act.slice(5), true));
        if (act === "signout") return run(async () => { await auth.signOut(); devs = null; svcData = {}; });
        if (act === "forgot") { const em = body.querySelector("[name=email]")?.value.trim(); if (!em) return flash("Type your email first", true); return run(async () => { await auth.reset(em); note = "📧 If that email has an account, a reset link is on its way"; }); }
        if (act === "linkdev") return run(async () => { await devices.link(); devs = await devices.list(); note = "✅ This device is linked"; });
        if (act === "opensim") return os.open("sim");
        if (act === "openai") return os.open("ai");
      });
      body.addEventListener("submit", e => {
        const np = e.target.closest("[data-newpw]");
        if (np) { e.preventDefault(); return run(async () => { await auth.newPassword(np.pw.value); note = "✅ Password changed"; }); }
        const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
        const em = f.email.value.trim(), pw = f.password.value;
        run(async () => {
          if (tab === "up") { const r = await auth.signUp(em, pw, f.name?.value.trim()); note = r.needsConfirm ? "📧 Almost done — open the email we sent to confirm your address, then sign in" : "✅ Account created"; if (r.needsConfirm) tab = "in"; }
          else await auth.signIn(em, pw);
        });
      });
      const onAuth = () => { if (!body.isConnected) return window.removeEventListener("bv:auth", onAuth); devs = null; svcData = {}; draw(); load(); };
      window.addEventListener("bv:auth", onAuth);
      draw(); load();
    }
  });

  /* start once the page is ready (os.js runs after this file) */
  window.addEventListener("load", () => setTimeout(() => { syncApps(); auth.init().catch(() => { }); }, 300));
})();

</script>
  <script>/* js/updates.js */
/* Blockvile Plus OS — software updates. Finds out when a newer version is published and updates in place
   (no re-download): the website/installed app refreshes its cache, the Android app downloads the new web files. */
(() => {
  const { store, esc } = window.BV;
  const CFG = () => window.BV_CONFIG || {};
  const local = () => window.BV_BUILD || { version: CFG().version || "", build: "" };
  const android = () => window.BV.android;
  const isAndroid = () => !!android()?.available;
  const os = () => window.BlockvileOS;
  const HOURS = 6;

  const st = { versions: null, vLoading: false, vError: "", checking: false, remote: null, error: "", last: store.get("updLast", 0), applying: false, pct: 0, msg: "" };
  const emit = () => { document.documentElement.classList.toggle("has-update", updates.available() && !st.applying); window.dispatchEvent(new Event("bv:update")); };

  const cmp = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d < 0 ? -1 : 1; } return 0; };

  // The site's top folder: the publisher's website (installUrl), or the site this copy is running from.
  // (An older release runs from <site>/versions/<x.y>/, so its folder is cut off to get back to the top.)
  const archived = () => !isAndroid() && /\/versions\/\d+(\.\d+)*\//.test(location.pathname);
  function siteRoot() {
    const base = CFG().installUrl;
    if (base) { try { return new URL(base.endsWith("/") ? base : base + "/").href; } catch { return ""; } }
    if (!isAndroid() && /^https?:$/.test(location.protocol) && location.origin !== "null") {
      const u = new URL(location.href); u.search = ""; u.hash = "";
      u.pathname = u.pathname.replace(/versions\/\d+(\.\d+)*\/[^/]*$/, "").replace(/[^/]*$/, "");
      return u.href;
    }
    return "";
  }
  const versionUrl = () => { const r = siteRoot(); return r ? r + "version.json" : ""; };
  const nativeApi = () => (isAndroid() ? android().ota()?.api || 1 : 99);
  const otaOn = () => !isAndroid() || !!android().ota()?.enabled;

  const updates = {
    state: st, local,
    configured: () => !!versionUrl(),
    // is a newer version published?
    available() {
      const r = st.remote; if (!r?.build) return false;
      if (r.build === local().build) return false;
      return cmp(r.version, local().version) >= 0;       // never "update" to an older one
    },
    needsStore: () => !!st.remote && (st.remote.native || 1) > nativeApi(),
    async check(manual) {
      const url = versionUrl();
      if (!url) { st.error = isAndroid() ? "The publisher hasn't set the update address yet" : "Updates need the hosted website"; if (manual) emit(); return false; }
      if (st.checking) return updates.available();
      st.checking = true; st.error = ""; emit();
      try {
        const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        if (typeof j.version !== "string" || !/^[a-f0-9]{12}$/.test(j.build || "")) throw new Error("bad version file");
        st.remote = { version: j.version, build: j.build, native: +j.native || 1, notes: Array.isArray(j.notes) ? j.notes.slice(0, 8).map(String) : [], released: j.released || "" };
        st.last = Date.now(); store.set("updLast", st.last);
      } catch (e) { st.error = navigator.onLine === false ? "You're offline" : "Couldn't reach the update server"; window.BV_DEBUG?.log("network", "update check", st.error + (e?.message ? " (" + e.message + ")" : "")); }
      st.checking = false; emit();
      if (updates.available()) announce();
      return updates.available();
    },
    // ---- Versions: every release is kept on the site, so people can go back to an older one or forward to a newer one
    versionsOk: () => isAndroid() ? otaOn() : !!siteRoot(),
    isOlderCopy: () => archived(),
    latest: () => (st.versions || []).slice(-1)[0] || null,
    async versions(force) {
      if (st.versions && !force) return st.versions;
      if (!updates.versionsOk()) { st.vError = isAndroid() ? "The publisher hasn't set the update address yet" : "Switching versions needs the hosted website"; emit(); return []; }
      st.vLoading = true; st.vError = ""; emit();
      try {
        const base = isAndroid() ? CFG().installUrl : siteRoot();
        const r = await fetch(new URL("versions/index.json?t=" + Date.now(), base.endsWith("/") ? base : base + "/").href, { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        st.versions = (Array.isArray(j.versions) ? j.versions : [])
          .filter(v => v && /^\d+(\.\d+){0,3}$/.test(v.version) && /^[a-f0-9]{12}$/.test(v.build || ""))
          .map(v => ({ version: v.version, build: v.build, native: +v.native || 1, released: String(v.released || ""), notes: Array.isArray(v.notes) ? v.notes.slice(0, 4).map(String) : [] }))
          .sort((a, b) => cmp(a.version, b.version));
      } catch (e) { st.vError = navigator.onLine === false ? "You're offline" : "Couldn't load the list of versions"; }
      st.vLoading = false; emit();
      return st.versions || [];
    },
    // why a version can't be used here, or "" if it can
    blocked(v) { return v.native > nativeApi() ? "Needs a newer Android app (Google Play)" : ""; },
    rel(v) { const c = cmp(v, local().version); return c === 0 ? "current" : c < 0 ? "older" : "newer"; },
    async switchTo(ver) {
      if (st.applying) return false;
      const list = await updates.versions(); const e = list.find(x => x.version === ver);
      if (!e) { st.vError = "That version isn't available"; emit(); return false; }
      if (e.version === local().version && !archived()) { os()?.toast("You're already on " + ver); return false; }
      if (updates.blocked(e)) { st.vError = updates.blocked(e); emit(); return false; }
      store.set("updPending", { to: e.version, build: e.build, notes: e.notes, kind: "switch" });
      const latest = updates.latest();
      st.applying = true; st.pct = 0; st.msg = "Switching to " + e.version + "…"; st.vError = ""; emit();
      if (isAndroid()) { android().otaSwitch(e.version); return true; }       // progress arrives as "bv:ota"; the app reloads itself
      setTimeout(() => {
        const root = siteRoot();
        if (latest && e.version === latest.version) { store.del("pin"); location.href = root + "?bvlatest=1"; }
        else { store.set("pin", e.version); location.href = root + "versions/" + e.version + "/index.html"; }
      }, 300);
      return true;
    },
    async apply() {
      if (st.applying) return;
      if (archived()) { await updates.versions(true); const l = updates.latest(); if (l) return updates.switchTo(l.version); }
      if (!updates.available()) return os()?.toast("✅ Blockvile is up to date");
      const target = st.remote.version;
      if (updates.needsStore()) { android()?.playUpdate?.(); return os()?.toast("This update comes through Google Play"); }
      st.applying = true; st.pct = 0; st.msg = "Starting…"; st.error = ""; emit();
      store.set("updPending", { to: target, build: st.remote.build, notes: st.remote.notes || [] });
      if (isAndroid()) {
        if (!otaOn()) { st.applying = false; st.error = "The publisher hasn't set the update address yet"; emit(); return; }
        android().otaApply();                       // progress arrives as "bv:ota"; the app reloads itself when done
        return;
      }
      try {
        const reg = await navigator.serviceWorker?.getRegistration?.();
        const sw = reg?.active || navigator.serviceWorker?.controller;
        if (sw) {
          await new Promise((res, rej) => {
            const t = setTimeout(() => rej(new Error("timeout")), 30000);
            navigator.serviceWorker.addEventListener("message", function f(e) { if (e.data === "bv-updated") { clearTimeout(t); navigator.serviceWorker.removeEventListener("message", f); res(); } else if (e.data === "bv-update-failed") { clearTimeout(t); rej(new Error("failed")); } });
            sw.postMessage("bv-update");
          });
          try { await reg.update(); } catch { }
          location.reload();
        } else {
          // no offline cache (one-file copy, or the browser doesn't allow it): reload past the browser cache
          const u = new URL(location.href); u.searchParams.set("v", st.remote.build); location.replace(u.href);
        }
      } catch (e) { st.applying = false; st.error = "The update didn't finish — check your connection and try again"; store.del("updPending"); emit(); }
    },
    // Short row for Settings that leads to the Software Update app (sw = Settings' switch helper)
    html() {
      const av = updates.available(), r = st.remote;
      return `<div class="h" id="sec-update">Software update</div>
        <div class="list">
          <button data-k="checkUpdate"><span><b>🔄 Check for updates</b><br><small>${st.checking ? "Checking…" : st.applying ? "Updating…" : av ? "Blockvile " + esc(r.version) + " is ready" : st.error ? "⚠️ " + esc(st.error) : "Version " + esc(local().version) + (st.last ? " · last checked " + new Date(st.last).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "")}</small></span><small>›</small></button>
          ${av && !st.applying ? `<button data-k="applyUpdate"><span><b style="color:var(--accent)">⬆️ Update now to ${esc(r.version)}</b><br><small>Nothing installs until you tap this</small></span><small>›</small></button>` : ""}
          <button data-k="openUpdates"><span>OS Update app<br><small>Updates, versions and history</small></span><small>›</small></button>
        </div>`;
    },
    history: () => store.get("updHistory", []),
    kind() { const k = os()?.installStatus?.(); return k === "android" ? "Android app" : k === "installed" ? "Installed app" : BV.embedded ? "Embedded in another page" : "Browser tab"; },
    isApp: () => { const k = os()?.installStatus?.(); return k === "android" || k === "installed"; },
  };

  // Tell the person once per new version
  function announce() {
    const r = st.remote; if (!r || store.get("updNotified", "") === r.build) return;
    store.set("updNotified", r.build);
    os()?.notify({ app: "updates", action: "update", icon: "⬆️", title: "Update available", text: `Blockvile ${r.version} is ready. Tap to update.` });
  }

  // Android reports download progress
  window.addEventListener("bv:ota", e => {
    const d = e.detail || {};
    if (d.state === "downloading") { st.applying = true; st.pct = d.pct || 0; st.msg = d.msg || ""; }
    else if (d.state === "error") { st.applying = false; st.error = d.msg || "Update failed"; store.del("updPending"); }
    else if (d.state === "done") { st.msg = "Restarting…"; }
    emit();
  });

  // Checking is automatic (shortly after start, and when you come back after a few hours). Installing never is.
  async function autoCheck(first) {
    if (!updates.configured()) return;
    if (!first && Date.now() - st.last < HOURS * 36e5) return;
    await updates.check(false);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) autoCheck(false); });

  // After an update: say so
  function justUpdated() {
    const p = store.get("updPending", null); if (!p) return;
    store.del("updPending");
    if (p.build && local().build === p.build) {     // only say so if the new version is really the one running now
      store.set("updHistory", [{ version: local().version, build: local().build, date: new Date().toISOString(), notes: p.notes || [], kind: p.kind || "" }, ...store.get("updHistory", [])].slice(0, 12));
      setTimeout(() => os()?.notify({ app: "updates", action: "update", icon: "✅", title: p.kind === "switch" ? "Version switched" : "Blockvile updated", text: "You're on version " + local().version + (p.notes?.length ? " — " + p.notes[0] : ""), sound: false }), 1500);
    }
  }

  // ---- Link with the Blockvile Updater (Supabase, same account): this device reports its version, and shows
  //      a card when the Updater asks it to switch. Nothing changes until the person taps.
  const link = { request: null, last: 0 };
  async function linkSync() {
    const A = window.BV.auth;
    if (!A?.configured?.() || !A.signedIn?.()) { if (link.request) { link.request = null; emit(); } return; }
    if (Date.now() - link.last < 15000) return; link.last = Date.now();
    try {
      const c = await A.client(), S = window.BV.services, key = S.deviceKey(), l = local();
      await c.from("os_status").upsert({ user_id: A.user.id, device_key: key, name: S.deviceName(), version: l.version, build: l.build || null, kind: updates.kind(), seen_at: new Date().toISOString() }, { onConflict: "user_id,device_key" });
      const { data } = await c.from("os_requests").select("*").eq("device_key", key).eq("status", "pending").order("created_at", { ascending: false }).limit(1);
      const r = data && data[0];
      if (r && /^\d+(\.\d+){0,3}$/.test(r.version)) {
        if (r.version === l.version && !archived()) { await c.from("os_requests").update({ status: "done" }).eq("id", r.id); link.request = null; }
        else {
          link.request = { id: r.id, version: r.version };
          if (store.get("reqNotified", 0) !== r.id) { store.set("reqNotified", r.id); os()?.notify({ app: "updates", action: "update", icon: "🔗", title: "Updater request", text: `Your Updater asked to switch to Blockvile ${r.version}. Tap to review.` }); }
        }
      } else link.request = null;
      emit();
    } catch { }
  }
  updates.request = () => link.request;
  updates.sync = linkSync;
  updates.answer = async accept => {
    const r = link.request; if (!r) return false;
    try { const c = await window.BV.auth.client(); await c.from("os_requests").update({ status: accept ? "done" : "dismissed" }).eq("id", r.id); } catch { }
    link.request = null; emit();
    return accept ? updates.switchTo(r.version) : true;
  };
  window.addEventListener("bv:auth", () => { link.last = 0; setTimeout(linkSync, 800); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) linkSync(); });
  setInterval(() => { if (!document.hidden) linkSync(); }, 300000);

  window.BV.updates = updates;

  /* ================= Software Update app ================= */
  window.BV_APPS.push({
    id: "updates", name: "OS Update", icon: "⬆️", bg: "linear-gradient(135deg,#22c55e,#0ea5e9)", cat: "System", system: true, size: [460, 580],
    keywords: "os update switch version older newer downgrade rollback versions upgrade software update new version install latest check patch app update",
    render(body, os) {
      const when = t => { if (!t) return "never"; const m = (Date.now() - t) / 6e4; return m < 1 ? "just now" : m < 60 ? Math.floor(m) + " min ago" : m < 1440 ? Math.floor(m / 60) + " h ago" : new Date(t).toLocaleDateString(); };
      let tab = "update", confirmV = "";
      const draw = () => {
        if (tab === "versions") return drawVersions();
        const l = local(), r = st.remote, av = updates.available(), store_ = updates.needsStore();
        const ota = isAndroid() ? android().ota() || {} : null;
        const state = st.applying ? "busy" : st.error ? "err" : st.checking ? "check" : av ? "new" : r ? "ok" : "idle";
        const title = { busy: "Updating…", err: "Couldn't update", check: "Checking for updates…", new: "Update available", ok: "Blockvile is up to date", idle: "Check for updates" }[state];
        const sub = { busy: esc(st.msg || "Working…"), err: esc(st.error), check: "Looking for a newer version…", new: `Blockvile Plus ${esc(r?.version || "")} is ready`, ok: `Version ${esc(l.version)} is the latest`, idle: `You have version ${esc(l.version)}` }[state];
        const ic = { busy: "⏳", err: "⚠️", check: "🔄", new: "⬆️", ok: "✅", idle: "⬆️" }[state];
        const history = updates.history();
        const rq = updates.request();
        body.innerHTML = `<div class="upd">${tabs()}
          ${rq ? `<div class="upd-card"><b>🔗 Request from your Updater</b><p class="muted" style="margin:6px 0 10px;font-size:13px">Your Blockvile Updater asked this device to ${updates.rel(rq.version) === "older" ? "go back to" : "move to"} <b>${esc(rq.version)}</b>. Nothing changes unless you agree.</p><button class="btn" data-u="req-yes">Switch to ${esc(rq.version)}</button> <button class="btn ghost" data-u="req-no">Not now</button></div>` : ""}
          <div class="upd-hero ${state}"><div class="upd-ic">${ic}</div><h2>${title}</h2><p>${sub}</p>
            ${st.applying ? `<div class="upd-bar"><i style="width:${Math.max(6, st.pct)}%"></i></div>` : ""}
            ${av && !st.applying ? `<button class="btn" data-u="now">${store_ ? "Update on Google Play" : "Update now"}</button>` : ""}
            ${!av && !st.applying ? `<button class="btn ${r ? "ghost" : ""}" data-u="check" ${st.checking ? "disabled" : ""}>${st.checking ? "Checking…" : "Check for updates"}</button>` : ""}
            ${state === "err" && av && !st.applying ? "" : ""}</div>
          ${av && r?.notes?.length ? `<div class="upd-card"><b>What's new in ${esc(r.version)}</b><ul>${r.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>` : ""}
          ${av && store_ ? `<p class="muted" style="font-size:13px;margin:0 4px 14px">This release changes the Android app itself, so it comes through Google Play.</p>` : ""}
          ${!updates.isApp() && !isAndroid() ? `<div class="upd-card"><b>You're using a browser tab</b><p class="muted" style="margin:6px 0 10px;font-size:13px">Install Blockvile as an app to get its own icon, offline use and updates that apply to the app itself.</p><button class="btn ghost" data-u="install">📲 Install the app</button></div>` : ""}
          <p class="muted" style="font-size:13px;margin:0 4px 14px">Updates never install by themselves. Blockvile tells you when one is ready, and nothing changes until you tap <b>Update now</b>.</p>
          <div class="h2">About this install</div>
          <div class="list">
            <div><span>Running as</span><b>${esc(updates.kind())}</b></div>
            <div><span>Version</span><b>${esc(l.version)}${l.build ? ` <small>(${esc(l.build)})</small>` : ""}</b></div>
            ${ota ? `<div><span>Android app</span><b>${esc(ota.version || "")}${ota.build ? ` <small>+ update ${esc(ota.build)}</small>` : ""}</b></div>` : ""}
            <div><span>Updates come from</span><b style="font-size:13px">${esc((() => { try { return new URL(versionUrl()).host; } catch { return "not set"; } })())}</b></div>
            <div><span>Last checked</span><b>${when(st.last)}</b></div>
          </div>
          ${history.length ? `<div class="h2">Update history</div><div class="list">${history.map(h => `<div><span>${h.kind === "switch" ? "Switched to " : ""}Blockvile ${esc(h.version)}<br><small>${esc(h.notes?.[0] || "")}</small></span><small>${new Date(h.date).toLocaleDateString()}</small></div>`).join("")}</div>` : ""}
        </div>`;
      };
      const tabs = () => `<div class="upd-tabs"><button class="${tab === "update" ? "on" : ""}" data-u="tab-update">Update</button><button class="${tab === "versions" ? "on" : ""}" data-u="tab-versions">Versions</button></div>`;
      const drawVersions = () => {
        const list = st.versions || [], cur = local().version, latest = updates.latest();
        const rows = list.slice().reverse().map(v => {
          const rel = updates.rel(v.version), bad = updates.blocked(v), isCur = rel === "current" && !updates.isOlderCopy();
          const tag = isCur ? "Current" : latest && v.version === latest.version ? "Latest" : rel === "older" ? "Older" : "Newer";
          const act = isCur ? "" : bad ? `<small class="muted">${esc(bad)}</small>`
            : confirmV === v.version ? `<button class="btn" data-u="go" data-v="${esc(v.version)}">Confirm</button>` : `<button class="btn ghost" data-u="ask" data-v="${esc(v.version)}">${rel === "older" ? "Switch back" : "Switch"}</button>`;
          return `<div class="upd-ver"><span><b>Blockvile ${esc(v.version)}</b> <em class="upd-tag ${tag.toLowerCase()}">${tag}</em><br><small>${esc(v.released)}${v.notes[0] ? " · " + esc(v.notes[0]) : ""}</small></span>${act}</div>`;
        }).join("");
        body.innerHTML = `<div class="upd">${tabs()}
          <div class="upd-card"><b>Choose your version</b><p class="muted" style="margin:6px 0 0;font-size:13px">You're on <b>${esc(cur)}</b>${updates.isOlderCopy() ? " (an older copy)" : ""}. Move to an older version if a new one doesn't suit you, or to a newer one any time. Your apps, files and settings stay as they are. Older versions may be missing newer features and fixes, so switch back to the latest when you can.</p></div>
          ${st.applying ? `<div class="upd-hero busy"><div class="upd-ic">⏳</div><h2>Switching…</h2><p>${esc(st.msg || "")}</p><div class="upd-bar"><i style="width:${Math.max(6, st.pct)}%"></i></div></div>` : ""}
          ${st.vError ? `<p class="er" style="margin:0 4px 10px">⚠️ ${esc(st.vError)}</p>` : ""}
          ${st.vLoading ? `<p class="muted" style="margin:0 4px">Loading versions…</p>` : rows ? `<div class="list">${rows}</div>` : st.vError ? "" : `<p class="muted" style="margin:0 4px">No versions found.</p>`}
          <p class="muted" style="font-size:13px;margin:12px 4px">Terminal: <code>switch version</code> shows this list, <code>switch version 3.15 now</code> switches.</p>
          ${isAndroid() || !siteRoot() ? "" : `<p class="muted" style="font-size:13px;margin:0 4px 10px">Want it as its own app? Open <a href="${esc(siteRoot())}updater.html" target="_blank" rel="noopener">the standalone Blockvile Updater</a> and install it to your home screen.</p>`}
          <button class="btn ghost" data-u="reload" ${st.vLoading ? "disabled" : ""}>Refresh list</button>
        </div>`;
      };
      const on = () => { if (!body.isConnected) return window.removeEventListener("bv:update", on); draw(); };
      window.addEventListener("bv:update", on);
      body.addEventListener("click", async e => {
        const b = e.target.closest("[data-u]"); if (!b) return;
        const a = b.dataset.u;
        if (a === "check") { const has = await updates.check(true); if (!has && !st.error) os.toast("✅ Blockvile is up to date"); draw(); }
        if (a === "now") updates.apply();
        if (a === "req-yes") { await updates.answer(true); return draw(); }
        if (a === "req-no") { await updates.answer(false); return draw(); }
        if (a === "tab-update" || a === "tab-versions") { tab = a === "tab-update" ? "update" : "versions"; confirmV = ""; draw(); if (tab === "versions" && !st.versions) updates.versions(); return; }
        if (a === "reload") { await updates.versions(true); return; }
        if (a === "ask") { confirmV = b.dataset.v; return draw(); }
        if (a === "go") { confirmV = ""; await updates.switchTo(b.dataset.v); return draw(); }
        if (a === "install") os.installApp();
      });
      draw(); updates.sync?.();
      if (updates.configured() && (!st.last || Date.now() - st.last > 60000)) updates.check(false);   // opening the app checks
    }
  });
  window.addEventListener("load", () => { emit(); justUpdated(); setTimeout(() => autoCheck(true), 6000); setTimeout(linkSync, 5000); });
})();

</script>
  <script>/* js/apps-debug.js */
/* Blockvile Plus OS — Debug Center app: see every problem Blockvile hit, copy or save the report, send it to the developer,
   or attach it to Feedback. Collection happens in debug-core.js. */
(() => {
  const { store, esc } = window.BV;
  const D = window.BV_DEBUG; if (!D) return;
  const CFG = () => window.BV_CONFIG || {};
  const os = () => window.BlockvileOS;
  const KINDS = { error: ["🔴", "Error"], network: ["🌐", "Network"], resource: ["🧩", "File"], warn: ["🟡", "Warning"] };
  const sharing = () => store.get("dbgShare", false) === true;

  function device() {
    const ua = navigator.userAgent, a = window.BV.android?.available ? window.BV.android.device?.() : null;

    const br = a ? "Blockvile Android app" : /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Other";
    return `${plat} · ${br} · ${screen.width}x${screen.height} · ${os()?.state?.mode || ""} mode`;
  }

    list = list || D.list();
    return [`Blockvile debug report`, `Version: ${CFG().version}`, `Device: ${device()}`, `Page: ${location.origin}${location.pathname}`, `Created: ${new Date().toISOString()}`, `Entries: ${list.length}`, "", ...list.map(line)].join("\n");
  }

  // ---- sending (only on the person's tap, or if they switched on automatic sharing) ----
  let sending = false, sessionSent = 0;
  async function send(list) {

    try {
      const c = await A.client(), dev = device().slice(0, 200);
      const rows = list.map(e => ({ app_version: String(CFG().version || "").slice(0, 20), device: dev, kind: e.kind, source: e.source.slice(0, 80), message: e.msg.slice(0, 600), stack: (e.stack || "").slice(0, 1500) || null, page: (location.origin + location.pathname).slice(0, 200), happened_at: new Date(e.t).toISOString() }));

    } finally { sending = false; }
  }
  let autoT = 0;
  D.on(e => {
    if (!e || e.kind === "warn" || !sharing() || sessionSent > 60) return;
    clearTimeout(autoT);
    autoT = setTimeout(() => { if (sending) return; const todo = D.list().filter(x => !x.sent && x.kind !== "warn"); if (todo.length) send(todo).catch(() => { }); }, 20000);
  });
  window.BV.debug = { list: D.list, report, send, clear: D.clear, sharing, setSharing: v => store.set("dbgShare", !!v), device, KINDS };

  window.BV_APPS.push({
    id: "debug", name: "Debug Center", icon: "🐞", bg: "linear-gradient(135deg,#475569,#0f172a)", cat: "System", system: true, size: [620, 640],
    keywords: "debug errors problems log crash report bug console diagnostics developer",
    render(body, os) {
      let filter = "all", open = -1, note = "", busy = false;
      const draw = () => {
        const all = D.list(), shown = all.filter(e => filter === "all" || (filter === "errors" ? e.kind === "error" : filter === "net" ? e.kind === "network" || e.kind === "resource" : e.kind === "warn")).slice().reverse();
        const nErr = all.filter(e => e.kind !== "warn").length;
        body.innerHTML = `<div class="dbg">
          <div class="dbg-head"><b>${nErr ? `🔴 ${nErr} problem${nErr === 1 ? "" : "s"} recorded` : "✅ No problems recorded"}</b><small class="muted">Version ${esc(CFG().version)} · ${esc(device())}</small></div>
          <div class="dbg-tabs">${[["all", "All"], ["errors", "Errors"], ["net", "Network & files"], ["warn", "Warnings"]].map(([k, l]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${l}</button>`).join("")}</div>
          <div class="dbg-list">${shown.length ? shown.map((e, i) => `<div class="dbg-row ${e.kind}" data-i="${i}">
              <div><span>${KINDS[e.kind]?.[0] || "•"}</span> <b>${esc(e.source || "")}</b>${e.n > 1 ? ` <em>×${e.n}</em>` : ""} <small class="muted">${time(e.t)}${e.sent ? " · sent" : ""}</small></div>
              <div class="dbg-msg">${esc(e.msg)}</div>${open === i && e.stack ? `<pre>${esc(e.stack)}</pre>` : ""}</div>`).join("") : `<p class="muted" style="text-align:center;padding:24px">Nothing here. Errors from every app show up in this list.</p>`}</div>
          ${note ? `<p class="dbg-note">${esc(note)}</p>` : ""}
          <div class="dbg-actions">
            <button class="btn" data-a="send" ${busy ? "disabled" : ""}>📤 Send to developer</button>
            <button class="btn ghost" data-a="feedback">💬 Attach to Feedback</button>
            <button class="btn" data-a="claude">🤖 Copy for Claude</button>
            <button class="btn ghost" data-a="copy">📋 Copy</button>
            <button class="btn ghost" data-a="save">💾 Save as file</button>
            <button class="btn ghost" data-a="clear">🗑 Clear</button></div>
          <label class="dbg-share"><input type="checkbox" data-share ${sharing() ? "checked" : ""}><span>Share errors with the developer automatically<br><small class="muted">Off by default. Sends only the error text, app version and device type, never passwords, keys or your files.</small></span></label>
        </div>`;
      };
      const on = e => { if (!body.isConnected) return; if (e === null || true) draw(); };
      let pending = 0;
      D.on(() => { if (body.isConnected) { clearTimeout(pending); pending = setTimeout(draw, 250); } });
      body.addEventListener("change", e => { if (e.target.matches("[data-share]")) { window.BV.debug.setSharing(e.target.checked); note = e.target.checked ? "Automatic sharing is on." : "Automatic sharing is off."; draw(); } });
      body.addEventListener("click", async e => {
        const f = e.target.closest("[data-f]"); if (f) { filter = f.dataset.f; open = -1; return draw(); }
        const row = e.target.closest("[data-i]"); if (row && !e.target.closest("button")) { open = open === +row.dataset.i ? -1 : +row.dataset.i; return draw(); }
        const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
        if (a === "clear") { D.clear(); note = "Cleared."; return draw(); }
        if (a === "copy") { try { await navigator.clipboard.writeText(report()); note = "Report copied."; } catch { note = "Couldn't copy — use Save as file."; } return draw(); }
        if (a === "claude") { const txt = "Please fix these Blockvile errors. Find the cause in the code and give me the fixed files in one zip.\n\n" + report(); try { await navigator.clipboard.writeText(txt); note = "Copied. Paste it into your chat with Claude and it will fix them."; } catch { window.BV.download(new Blob([txt], { type: "text/plain" }), "blockvile-errors-for-claude.txt"); note = "Couldn't copy, so I saved a file. Send that file to Claude."; } return draw(); }
        if (a === "save") { window.BV.download(new Blob([report()], { type: "text/plain" }), `blockvile-debug-${new Date().toISOString().slice(0, 10)}.txt`); return; }
        if (a === "feedback") { const file = new File([report()], "blockvile-debug-report.txt", { type: "text/plain" }); return os.open("feedback", { type: "bug", text: "Debug report attached.", files: [file] }); }
        if (a === "send") {
          busy = true; note = "Sending…"; draw();
          try { const n = await send(D.list()); note = n ? `✅ Sent ${n} problem${n === 1 ? "" : "s"} to the developer. Thank you!` : "Nothing to send — no errors recorded."; }
          catch (err) { note = "⚠️ " + (err.message || "Couldn't send") + ". You can use Copy or Save as file instead."; }
          busy = false; draw();
        }
      });
      draw();
    }
  });
})();

  <script>/* js/apps-sim-ai.js */
/* Blockvile Plus OS — Digital SIM (signed-in users only) and Blockvile AI */
(() => {

    render(body, os) {

      const drawNow = () => {
        if (!sim) { body.innerHTML = `<div class="sim"><p class="muted" style="padding:20px">${note ? "⚠️ " + esc(note) : "Setting up your SIM…"}</p></div>`; return; }
        body.innerHTML = `<div class="sim">${card()}

        <form class="sim-send" data-send><input class="field" name="b" placeholder="Message" autocomplete="off" maxlength="1000"><button class="btn" ${busy ? "disabled" : ""}>Send</button></form>`;

      const refresh = async () => { try { const c = await auth.client(); const { data } = await c.from("sim_messages").select("*").order("created_at", { ascending: false }).limit(200); if (data) { const had = msgs.length; msgs = data; if (data.length !== had && !body.querySelector("input:focus")) draw(); else if (data.length !== had) draw(); } } catch { } };
