      const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
      const draw = () => {
        const cur = list[i];
        body.innerHTML = `<div class="music-now"><div class="art">${cur ? "💿" : "🎶"}</div><b>${cur ? esc(cur.name.replace(/\.[^.]+$/, "")) : "Nothing playing"}</b>
          <input type="range" min="0" max="1000" value="0" data-seek aria-label="Seek"><div class="row" style="justify-content:space-between;font-size:12px"><span data-ct>0:00</span><span data-dt>0:00</span></div>
          <div class="music-ctrl"><button data-c="shuffle" style="opacity:${shuffle ? 1 : .5}">🔀</button><button data-c="prev">⏮</button><button data-c="play">${audio.paused ? "▶" : "⏸"}</button><button data-c="next">⏭</button><button data-c="repeat" style="opacity:${repeat ? 1 : .5}">🔁</button></div></div>
          <div class="toolbar"><button class="btn" data-add>＋ Add music files</button><input type="file" accept="audio/*" multiple hidden data-file><small class="muted" style="margin-left:auto">${list.length} songs</small></div>
          ${list.length ? `<div class="list">${list.map((s, n) => `<div data-song="${n}" style="cursor:pointer;${n === i ? "color:var(--accent);font-weight:600" : ""}"><span>${n === i && !audio.paused ? "🔊 " : ""}${esc(s.name)}</span><span class="row"><small>${fmtSize(s.blob.size)}</small><button data-rm="${n}">🗑</button></span></div>`).join("")}</div>` : `<p class="muted center">Add songs from your device — they're saved in this browser.</p>`}`;
      };
      const play = n => { if (!list.length) return; i = (n + list.length) % list.length; if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(list[i].blob); audio.src = url; audio.play().catch(() => { }); draw(); };
      const next = () => play(shuffle ? Math.floor(Math.random() * list.length) : i + 1);
      audio.addEventListener("ended", () => repeat ? play(i) : next());
      audio.addEventListener("play", draw); audio.addEventListener("pause", draw);

  A.push({

        drawB(); loop();

      const loop = () => { clearTimeout(timer); timer = setTimeout(step, speed); };

    }
  });
})();

  <script>/* js/apps-web.js */
/* Blockvile Plus OS — websites stay inside Blockvile.
   BV.openWeb(url) shows a site in a Blockvile window (web version) or in the app's own in-app browser (Android).
   Some big sites (Google Play, Gmail, YouTube, Facebook …) forbid being shown inside another page — that's their rule,
   not something an app can override. For those the window says so and offers "Open outside Blockvile". */
(() => {
  const { esc } = window.BV;
  const A = window.BV_APPS;
  const os = () => window.BlockvileOS;
  const isWeb = u => /^https?:\/\//i.test(String(u || "").trim());
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return String(u); } };
  // sites that refuse to be framed (they send X-Frame-Options / frame-ancestors)
  const BLOCKS = /(^|\.)(play\.google\.com|accounts\.google\.com|mail\.google\.com|drive\.google\.com|docs\.google\.com|calendar\.google\.com|myaccount\.google\.com|youtube\.com|facebook\.com|instagram\.com|twitter\.com|x\.com|github\.com|linkedin\.com|amazon\.[a-z.]+|netflix\.com|outlook\.live\.com|office\.com|teams\.microsoft\.com|onedrive\.live\.com|account\.microsoft\.com|login\.live\.com|login\.microsoftonline\.com|paypal\.com|reddit\.com)$/i;
  const blocked = u => { try { return BLOCKS.test(new URL(u).hostname); } catch { return false; } };
  const outside = u => { try { window.open(u, "_blank", "noopener"); } catch { } };   // an explicit "open outside" choice (Android: phone browser)

  function openWeb(url, title) {
    url = String(url || "").trim();
    if (!isWeb(url)) return false;
    const nat = window.BV.android;
    if (nat?.available) { nat.inApp(url); return true; }       // Android: Blockvile's own in-app browser — any site works
    os()?.open("webview", { url, title: title || host(url) });
    return true;
  }
  window.BV.openWeb = openWeb;
  window.BV.openOutside = outside;
  window.BV.webBlocked = blocked;

  A.push({
    id: "webview", name: "Web", icon: "🌐", bg: "linear-gradient(135deg,#0ea5e9,#6366f1)", cat: "Internet", hidden: true, net: true, size: [900, 640],
    render(body, o, args) {
      let url = args?.url || "";
      body.style.padding = "0";
      if (!isWeb(url)) { body.innerHTML = `<p class="muted" style="padding:20px">Nothing to show.</p>`; return; }
      o.setTitle("webview", args.title || host(url));
      const bar = `<div class="toolbar" style="padding:8px 10px;margin:0;border-bottom:1px solid var(--line)"><small class="muted" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(url)}</small>
        <button class="btn ghost" data-r title="Reload">↻</button><button class="btn ghost" data-x title="Opens in your browser, outside Blockvile">↗ Open outside Blockvile</button></div>`;
      if (blocked(url)) {
        body.innerHTML = `${bar}<div style="padding:26px 22px;max-width:520px;margin:0 auto;text-align:center">
          <div style="font-size:46px">🛡️</div><h3 style="margin:8px 0">${esc(host(url))} doesn't allow being shown inside other apps</h3>
          <p class="muted">That's the website's own rule, so Blockvile can't show it in a window here. In the <b>Blockvile Android app</b> it opens inside the app instead.</p>
          <p><button class="btn" data-x>↗ Open outside Blockvile</button></p></div>`;
      } else {
        body.innerHTML = `${bar}<iframe src="${esc(url)}" title="${esc(host(url))}" style="width:100%;height:calc(100% - 50px);border:0;background:#fff" referrerpolicy="no-referrer"
          allow="autoplay; encrypted-media; fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-presentation"></iframe>
          <div class="muted" style="position:absolute;left:0;right:0;bottom:0;font-size:11px;text-align:center;padding:3px;pointer-events:none;background:linear-gradient(transparent,var(--bg,transparent))">Page blank? This site may not allow being shown here — use “Open outside Blockvile”.</div>`;
      }
      body.addEventListener("click", e => {
        if (e.target.closest("[data-x]")) outside(url);
        if (e.target.closest("[data-r]")) { const f = body.querySelector("iframe"); if (f) f.src = f.src; }
      });
    },
  });

  // links that would open a new tab stay inside Blockvile instead
  document.addEventListener("click", e => {
    const a = e.target.closest?.("a[target=_blank]"); if (!a || !a.href) return;
    if (e.defaultPrevented || !isWeb(a.href)) return;
    e.preventDefault(); openWeb(a.href, a.textContent.trim().slice(0, 40));
  });
})();

        if (over) return; const before = JSON.stringify(g);

          let line = d === "L" || d === "R" ? g[i].slice() : g.map(r => r[i]);

  A.push({

        const v = parseFloat(body.querySelector("[data-v]").value), a = body.querySelector("[data-a]").value, b = body.querySelector("[data-b]").value;

        body.querySelector("[data-out]").textContent = f(conv(v, a, b));
        body.querySelector("[data-all]").innerHTML = Object.keys(U[cat]).filter(u => u !== a).map(u => `<div><span>${u}</span><b>${f(conv(v, a, u))}</b></div>`).join("");
      };
      body.addEventListener("click", e => { const c = e.target.closest("[data-cat]"); if (c) { cat = c.dataset.cat; draw(); }
        if (e.target.closest("[data-swap]")) { const a = body.querySelector("[data-a]"), b = body.querySelector("[data-b]"); [a.value, b.value] = [b.value, a.value]; calc(); } });
      body.addEventListener("input", calc); body.addEventListener("change", calc);
      draw();
    }
  });
})();

  <script>/* js/apps-video.js */
/* Blockvile Plus OS — YouTube app. The app IS the Tube page (tube.html). No login: you add your OWN YouTube Data API key (🔑),
   it is kept only on this device, and search/trending talk straight to YouTube. Videos play in YouTube's official embedded player.

(() => {
  const { store } = window.BV;

  const myKey = () => { try { const k = String(store.get("ytKey", "") || "").trim(); return /^AIza[\w-]{30,45}$/.test(k) ? k : ""; } catch { return ""; } };   // your own key: typed by you, kept only on this device
  const decode = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };

    id: "videos", name: "YouTube", icon: "▶️", bg: "linear-gradient(135deg,#ff2d2d,#b91c1c)", cat: "Media", net: true, dock: true, size: [980, 680],
    keywords: "youtube video watch tube clips music videos search",

      // Public, key-free search (tried when the publisher's function isn't available), so the app keeps working with no errors shown
      const MIRRORS = ["https://api.piped.private.coffee", "https://pipedapi.kavin.rocks", "https://pipedapi.adminforge.de"];
      const iso = n => { n = Math.max(0, Math.floor(+n || 0)); const h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), s = n % 60; return "PT" + (h ? h + "H" : "") + (m ? m + "M" : "") + (s || (!h && !m) ? s + "S" : ""); };
      async function mirror(op, params) {
        const path = op === "search" ? "/search?filter=videos&q=" + encodeURIComponent(params.q || "") : "/trending?region=" + encodeURIComponent(params.region || "US");
        for (const base of MIRRORS) {
          try {
            const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
            const r = await fetch(base + path, { signal: ctl.signal }); clearTimeout(t);
            if (!r.ok) continue;
            const j = await r.json(), list = Array.isArray(j) ? j : j.items;
            const out = (list || []).map(x => ({ id: (String(x.url || "").match(/[?&]v=([\w-]{11})/) || [])[1] || "", title: String(x.title || ""), channel: String(x.uploaderName || ""), published: x.uploaded > 0 ? new Date(x.uploaded).toISOString() : "", description: String(x.shortDescription || ""), duration: iso(x.duration), views: +x.views || 0, likes: 0 })).filter(v => v.id && v.duration !== "PT0S").slice(0, 24);
            if (out.length) return out;
          } catch { }
        }
        return [];
      }

      // ---- your own YouTube key (🔑 button): the app talks to YouTube directly; the key never leaves this device ----
      async function direct(op, params) {
        const key = myKey(); if (!key) return null;
        const api = async (path, q) => { const r = await fetch("https://www.googleapis.com/youtube/v3/" + path + "?" + new URLSearchParams({ ...q, key }), { cache: "no-store" }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j?.error?.message || ("YouTube said HTTP " + r.status)); return j; };
        let ids;
        if (op === "search") { const j = await api("search", { part: "id", type: "video", maxResults: "24", safeSearch: "moderate", q: params.q || "" }); ids = (j.items || []).map(x => x.id?.videoId).filter(Boolean); }
        else { const j = await api("videos", { part: "snippet,contentDetails,statistics", chart: "mostPopular", regionCode: params.region || "US", maxResults: "24" }); return (j.items || []).map(x => ({ id: x.id, title: x.snippet?.title || "", channel: x.snippet?.channelTitle || "", published: x.snippet?.publishedAt || "", description: String(x.snippet?.description || "").slice(0, 1200), duration: x.contentDetails?.duration || "", views: +x.statistics?.viewCount || 0, likes: +x.statistics?.likeCount || 0 })); }
        if (!ids.length) return [];
        const j = await api("videos", { part: "snippet,contentDetails,statistics", id: ids.join(",") });
        return (j.items || []).map(x => ({ id: x.id, title: x.snippet?.title || "", channel: x.snippet?.channelTitle || "", published: x.snippet?.publishedAt || "", description: String(x.snippet?.description || "").slice(0, 1200), duration: x.contentDetails?.duration || "", views: +x.statistics?.viewCount || 0, likes: +x.statistics?.likeCount || 0 }));
      }

      // ---- the publisher's server function first (the key is there, not here); anything that goes wrong is logged quietly in the Debug Center ----
      async function call(op, params) {
        if (!myKey()) throw new Error("Add your YouTube key first (tap 🔑)");
        try {
          const v = await direct(op, params);
          return (v || []).map(x => ({ ...x, title: decode(x.title), channel: decode(x.channel), description: decode(x.description) }));
        } catch (e) {
          const m = String(e?.message || e);
          window.BV_DEBUG?.log("error", "YouTube " + op, m);
          throw new Error(/key|quota|forbidden|denied/i.test(m) ? "YouTube refused your key: " + m : navigator.onLine === false ? "You're offline" : "YouTube didn't answer. Try again.");
        }
      }
      const region = () => (navigator.language.split("-")[1] || "US").toUpperCase();
      const state = () => myKey() ? "ok" : "key";   // no login: just your own YouTube key

      // what you saved in the old YouTube app moves across (once)
      function saved() {
        let s = store.get("tubeState", null);
        if (!s) {
          const old = it => it && it.type === "video" && /^[\w-]{11}$/.test(it.id || "") ? { id: it.id, title: it.title || "YouTube video", channel: it.author || "YouTube" } : null;
          s = { subs: [], liked: [], disliked: [], later: store.get("ytLib", []).map(old).filter(Boolean), hist: store.get("ytHist", []).map(old).filter(Boolean) };
        }
        return s;
      }

      const post = m => { try { frame?.contentWindow?.postMessage({ bv: "tube", ...m }, "*"); } catch { } };
      let home = null;
      async function init() {
        status = state(); let err = "";
        if (status === "ok" && home === null) { try { home = await call("trending", { region: region() }); } catch (e) { home = []; err = e.message; } }
        post({ type: "init", status, home: status === "ok" ? home : [], saved: saved() });
        if (err) post({ type: "error", message: err });
      }
      async function onMsg(e) {
        if (!frame || e.source !== frame.contentWindow || !e.data || typeof e.data.bv !== "string") return;
        const d = e.data;
        if (d.bv === "tube-ready") return init();
        if (d.bv === "tube-search" && typeof d.q === "string") {
          const q = d.q.replace(/\s+/g, " ").trim().slice(0, 100); if (!q) return;
          try { post({ type: "results", q, videos: await call("search", { q }) }); }
          catch (err) { post({ type: "error", message: err.message || "Search failed" }); }
        }
        if (d.bv === "tube-accounts" || d.bv === "tube-key") kb.click();
        if (d.bv === "tube-save" && d.state && typeof d.state === "object") {
          const cut = a => (Array.isArray(a) ? a : []).slice(0, 60);
          const raw = r => ({ id: String(r?.id || ""), title: String(r?.title || "").slice(0, 200), channel: String(r?.channel || "").slice(0, 100), published: String(r?.published || ""), duration: String(r?.duration || ""), views: +r?.views || 0, likes: +r?.likes || 0 });
          const ok = r => /^[\w-]{11}$/.test(String(r?.id || ""));
          const s = d.state;
          store.set("tubeState", { subs: cut(s.subs).map(x => String(x).slice(0, 80)), liked: cut(s.liked).filter(ok).map(raw), disliked: cut(s.disliked).map(String).filter(x => /^[\w-]{11}$/.test(x)), later: cut(s.later).filter(ok).map(raw), hist: cut(s.hist).filter(ok).map(raw) });
        }
      }
      window.addEventListener("message", onMsg);
      

      body.innerHTML = `<iframe data-tube title="YouTube" style="width:100%;height:100%;border:0;background:#0f0f0f;display:block" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-presentation"></iframe>`;
      frame = body.querySelector("[data-tube]");
      body.style.position = "relative";
      const kb = document.createElement("button");
      kb.type = "button"; kb.title = "Use your own YouTube key"; kb.textContent = "🔑";
      kb.style.cssText = "position:absolute;right:10px;bottom:10px;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(20,20,20,.85);color:#fff;font-size:16px;cursor:pointer;opacity:.75";
      kb.onclick = async () => {
        const cur = myKey();
        const v = await window.BV.ask(cur ? "Your YouTube key is set (kept only on this device). Paste a new one, or clear it to remove:" : "Paste your own YouTube Data API key (starts with AIza). It stays only on this device:", cur);
        if (v === null) return;
        const k = v.trim();
        if (!k) { store.del("ytKey"); os.toast?.("YouTube key removed"); }
        else if (!/^AIza[\w-]{30,45}$/.test(k)) { os.toast?.("That doesn't look like a YouTube key"); return; }
        else { store.set("ytKey", k); os.toast?.("YouTube key saved on this device"); }
        home = null; init();
      };
      // (the key button lives in the Tube sidebar as "Your key"; it asks this app to open the key box)
      const el = document.getElementById("bv-tube-src");     // the one-file copy carries tube.html inside itself
      let html = ""; if (el) { try { html = new TextDecoder().decode(Uint8Array.from(atob(el.textContent.trim()), c => c.charCodeAt(0))); } catch { } }
      if (html) frame.srcdoc = html; else frame.src = "tube.html";
      return () => { window.removeEventListener("message", onMsg); };
    }
  });
})();

</script>

    { id: "modes", icon: "📱", title: "Phone, Tablet and Laptop modes", tags: "mode layout desktop tablet split screen windows rotate", body: () => `

    { id: "exit", icon: "⏏", title: "Exit Blockvile and use your device", tags: "exit application exit quit close leave original os normal home screen launcher back", body: () => `
      <p>Press <b>Exit</b> any time — the red ⏻ button in the corner, <code>application exit</code> in the Terminal, <b>Exit Blockvile Plus OS</b> in the Control Centre, or <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>E</kbd>.</p>

    { id: "fulldevice", icon: "⛶", title: "Temporary takeover", tags: "temporary takeover full screen whole device kiosk system take over application exit terminal", body: () => `
      <p>Tap <b>Temporarily let Blockvile take over this device</b> (on the home screen, in the Control Centre or in Settings) and Blockvile acts as your device's system — <b>only until you end it</b>. It is never permanent, never starts by itself, and is never saved.</p>

        <li>Reloading the page, closing the app or (on Android) restarting the phone also ends it.</li></ul>

    { id: "inapp", icon: "🪟", title: "Sites and apps stay inside Blockvile", tags: "browser inside in app website link open tab google play embedded youtube gmail blocked outside", body: () => `
      <p>Links open <b>inside Blockvile</b> — in a Blockvile window on the web, and in Blockvile's own in-app browser on Android — instead of jumping to your phone's browser.</p>

    { id: "trouble", icon: "🧰", title: "Troubleshooting", tags: "problem not working fix broken error help saved reset camera microphone install missing slow", body: () => `
      <h4>“Changes won't be saved”</h4><p>The page Blockvile is in doesn't allow storage (some embeds do this). Open Blockvile on its own to keep your changes.</p>
